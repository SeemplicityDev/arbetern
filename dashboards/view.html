<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>arbetern — dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>(function(){try{var t=localStorage.getItem('arbetern-theme');if(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)t='light';document.documentElement.dataset.theme=t||'dark';}catch(e){document.documentElement.dataset.theme='dark';}})();</script>
  <style>
    :root {
      /* ── arbetern "Night Shift" design tokens ──
         Keep in sync across ui/index.html, dashboards/view.html,
         workflows/view.html. */
      --bg:#0c0e13; --surface:#11141b; --surface-glass:#11141b;
      --card:#151923; --card-2:#1a1f2b; --card-hover:#1f2533;
      --border:#272e3c; --border-accent:#3a4456;
      --text:#c3cbd8; --text-bright:#e9edf4; --text-muted:#7f8a9b;
      --accent:#7297bd; --accent-2:#8f87b8; --gold:#c0a368;
      --green:#83b08a; --red:#c47f7f; --amber:#c79a5e; --cyan:#76a8b8;
      --deep:#0a0c10;
      --on-accent:#10131a;
      color-scheme:dark;
      --font-display:'Bricolage Grotesque','Archivo',sans-serif;
      --font-body:'Archivo',-apple-system,'Segoe UI',sans-serif;
      --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;
      --shadow-card:0 1px 2px rgba(0,0,0,.3);
    }
    /* Light theme — matte paper */
    html[data-theme="light"]{
      --bg:#e8eaed; --surface:#f3f4f6; --surface-glass:#f3f4f6;
      --card:#fbfbfc; --card-2:#eff1f3; --card-hover:#e7eaee;
      --border:#d3d8de; --border-accent:#b4bcc7;
      --text:#3b4350; --text-bright:#161c25; --text-muted:#67717e;
      --accent:#46688e; --accent-2:#6a6293; --gold:#94783c;
      --green:#4d7a57; --red:#a35454; --amber:#96702f; --cyan:#3d7287;
      --deep:#eceef1;
      --on-accent:#f6f8fa;
      --shadow-card:0 1px 2px rgba(25,35,50,.1);
      color-scheme:light;
    }
    html[data-theme="light"] body::before{
      background-image:linear-gradient(rgba(50,62,80,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(50,62,80,.05) 1px,transparent 1px)}
    .theme-toggle{position:relative;width:46px;height:24px;flex-shrink:0;border-radius:20px;background:var(--card-2);border:1px solid var(--border);cursor:pointer;padding:0;transition:background .2s ease,border-color .2s ease}
    .theme-toggle:hover{border-color:var(--border-accent)}
    .theme-toggle-knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;transform:translateX(22px);transition:transform .3s cubic-bezier(.22,1,.36,1)}
    html[data-theme="light"] .theme-toggle-knob{transform:translateX(0)}
    .theme-toggle .tt-sun{display:none}
    html[data-theme="light"] .theme-toggle .tt-sun{display:block}
    html[data-theme="light"] .theme-toggle .tt-moon{display:none}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-body);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;background:var(--bg)}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
      background-image:linear-gradient(rgba(143,152,168,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(143,152,168,.04) 1px,transparent 1px);
      background-size:44px 44px;
      -webkit-mask-image:radial-gradient(ellipse 90% 65% at 50% 0%,#000 0%,transparent 100%);
      mask-image:radial-gradient(ellipse 90% 65% at 50% 0%,#000 0%,transparent 100%)}
    header{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:10}
    header::before{content:'';position:absolute;inset:0 0 auto 0;height:2px;background:var(--gold)}
    header h1{font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:-.3px;color:var(--text-bright)}
    header .meta{font-size:12px;color:var(--text-muted);margin-top:2px}
    header .badge{font-family:var(--font-mono);font-size:11px;padding:4px 12px;border-radius:20px;background:var(--card);border:1px solid var(--border);color:var(--text-muted)}
    header .badge.ok{color:var(--green);border-color:rgba(131,176,138,.35);background:rgba(131,176,138,.07)}
    header .badge.err{color:var(--red);border-color:rgba(196,127,127,.35);background:rgba(196,127,127,.07)}
    main{max-width:1400px;margin:0 auto;padding:28px 24px;position:relative;z-index:1}
    .description{color:var(--text-muted);font-size:13px;margin-bottom:24px;max-width:820px;line-height:1.6}
    .source{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:18px;animation:rise .5s cubic-bezier(.16,1,.3,1) backwards}
    .source:nth-child(1){animation-delay:.03s}.source:nth-child(2){animation-delay:.09s}.source:nth-child(3){animation-delay:.15s}.source:nth-child(4){animation-delay:.21s}.source:nth-child(5){animation-delay:.27s}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .source-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap}
    .source-title{font-family:var(--font-display);font-size:15px;font-weight:600;color:var(--text-bright)}
    .source-type{font-family:var(--font-mono);font-size:11px;color:var(--accent);padding:2px 8px;border-radius:4px;background:rgba(114,151,189,.1);border:1px solid rgba(114,151,189,.22)}
    .source-meta{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
    .source-error{font-size:13px;color:var(--red);background:rgba(196,127,127,.06);border:1px solid rgba(196,127,127,.25);border-radius:8px;padding:10px 14px;font-family:var(--font-mono)}
    pre.content{background:var(--deep);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:var(--font-mono);font-size:12px;line-height:1.5;color:var(--text);overflow-x:auto;white-space:pre-wrap;word-break:break-word;max-height:520px}
    .rich{background:var(--deep);border:1px solid var(--border);border-radius:8px;padding:14px;font-size:13px;line-height:1.55;color:var(--text);overflow-x:auto;white-space:pre-wrap;word-break:break-word;max-height:640px}
    .rich strong{color:var(--text-bright);font-weight:600}
    .rich code{font-family:var(--font-mono);font-size:12px;background:var(--card-2);padding:1px 5px;border-radius:3px;color:var(--cyan)}
    .rich hr{border:0;border-top:1px solid var(--border);margin:10px 0}
    details.cell{display:inline-block;max-width:100%}
    details.cell summary{cursor:pointer;color:var(--accent);font-size:12px;list-style:none}
    details.cell summary::-webkit-details-marker{display:none}
    details.cell pre{margin-top:6px;background:var(--deep);border:1px solid var(--border);border-radius:6px;padding:8px;font-family:var(--font-mono);font-size:11px;white-space:pre-wrap;max-height:260px;overflow:auto}
    .table-wrap{width:100%;overflow-x:auto;border:1px solid var(--border);border-radius:8px;background:var(--deep)}
    table{width:100%;border-collapse:collapse;font-size:13px;table-layout:auto}
    th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top;max-width:360px;overflow-wrap:anywhere;word-break:break-word;white-space:normal}
    th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);font-weight:600;background:var(--card);position:sticky;top:0}
    td a{word-break:break-all}
    tbody tr{transition:background .12s ease}
    tbody tr:hover{background:rgba(114,151,189,.05)}
    tr:last-child td{border-bottom:none}
    .empty{color:var(--text-muted);font-size:13px;font-style:italic;padding:6px 0}
    .footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--border);color:var(--text-muted);font-size:11px;text-align:center}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}

    /* Datadog metrics (datadog_query_metrics source) chart widgets. */
    .metrics-site{margin-bottom:18px}
    .metrics-site:last-child{margin-bottom:0}
    .metrics-site h4{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin:0 0 8px;font-weight:600;display:flex;gap:10px;align-items:center}
    .metrics-site h4 .q{font-family:var(--font-mono);font-size:11px;color:var(--accent);background:rgba(114,151,189,.1);border:1px solid rgba(114,151,189,.22);padding:2px 8px;border-radius:4px;text-transform:none;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%}
    .metrics-site h4 .dd-link{margin-left:auto;font-size:11px;color:var(--accent);text-transform:none;letter-spacing:0;font-weight:500;padding:2px 8px;border:1px solid var(--border);border-radius:4px;background:var(--card);cursor:pointer;font-family:inherit;transition:border-color .15s ease,background .15s ease}
    .metrics-site h4 .dd-link + .dd-link{margin-left:6px}
    .metrics-site h4 .dd-link:hover{text-decoration:none;background:var(--card-hover);border-color:var(--border-accent)}
    .metrics-chart{background:var(--deep);border:1px solid var(--border);border-radius:8px;padding:10px;height:320px}
    .metrics-chart canvas{max-height:300px}
    .metrics-summary{margin-top:10px;font-size:12px;color:var(--text-muted)}
    .metrics-summary table{font-size:12px}
    .metrics-summary th,.metrics-summary td{padding:4px 10px}

    /* Prompt-driven dashboard: rendered Markdown report (Kind="prompt") */
    .report{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px 28px;margin-bottom:24px;line-height:1.6;font-size:14px}
    .report .md-h{font-family:var(--font-display);color:var(--text-bright);line-height:1.3;margin:22px 0 10px}
    .report h1.md-h{font-size:24px} .report h2.md-h{font-size:20px;border-bottom:1px solid var(--border);padding-bottom:6px}
    .report h3.md-h{font-size:16px} .report h4.md-h,.report h5.md-h,.report h6.md-h{font-size:14px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted)}
    .report > *:first-child{margin-top:0}
    .report p{margin:10px 0}
    .report .md-list{margin:8px 0;padding-left:22px}
    .report .md-list li{margin:4px 0}
    .report a{color:var(--accent)}
    .report code{font-family:var(--font-mono);font-size:12.5px;background:var(--deep);border:1px solid var(--border);border-radius:4px;padding:1px 5px}
    .report .md-pre{background:var(--deep);border:1px solid var(--border);border-radius:8px;padding:12px 14px;overflow:auto;margin:12px 0}
    .report .md-pre code{background:none;border:none;padding:0;font-size:12.5px;white-space:pre}
    .report .md-quote{border-left:3px solid var(--border-accent);margin:12px 0;padding:4px 14px;color:var(--text-muted);background:var(--deep);border-radius:0 8px 8px 0}
    .report hr{border:none;border-top:1px solid var(--border);margin:20px 0}
    .report .md-table{border-collapse:collapse;width:100%;margin:14px 0;font-size:13px}
    .report .md-table th,.report .md-table td{border:1px solid var(--border);padding:7px 12px;text-align:left;vertical-align:top}
    .report .md-table th{background:var(--deep);color:var(--text-bright);font-weight:600}
    .report .md-table tr:nth-child(even) td{background:rgba(127,127,127,.04)}
    /* Prompt template render form + rendered-instance list */
    .prompt-form h3, .instances h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin:0 0 10px;font-weight:600}
    .prompt-form .form-row{margin-bottom:12px}
    .prompt-form label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:5px}
    .prompt-form label .opt{text-transform:none;letter-spacing:0;opacity:.7}
    .prompt-form input[type=text]{width:100%;max-width:420px;background:var(--deep);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:inherit;font-size:13px;outline:none;transition:border-color .15s ease,box-shadow .15s ease}
    .prompt-form input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(114,151,189,.15)}
    .form-actions{display:flex;align-items:center;gap:12px;margin-top:16px}
    .render-btn{background:var(--accent);color:var(--on-accent,#0b1220);border:none;border-radius:8px;padding:9px 18px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s ease}
    .render-btn:hover{opacity:.9} .render-btn:disabled{opacity:.55;cursor:wait}
    .pf-status{font-size:12px;color:var(--text-muted)}
    .instances{margin-top:24px;border-top:1px solid var(--border);padding-top:18px}
    .inst-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:var(--deep);text-decoration:none;color:var(--text)}
    .inst-row:hover{border-color:var(--border-accent);text-decoration:none}
    .inst-label{font-weight:600;color:var(--text-bright)}
    .inst-when{font-size:12px;color:var(--text-muted)}
    .report-inputs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border)}
    .input-chip{font-size:12px;background:var(--deep);border:1px solid var(--border);border-radius:20px;padding:3px 11px;color:var(--text-muted)}
    .input-chip b{color:var(--text-bright);font-weight:600}
    .report-tmpl{font-size:12px;color:var(--accent);margin-left:auto}
    .rerender-btn{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:4px 12px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
    .rerender-btn:hover{border-color:var(--border-accent)}
    .rerender-btn:disabled{opacity:.55;cursor:wait}
    .render-error{background:rgba(196,127,127,.1);border:1px solid rgba(196,127,127,.45);color:var(--red);border-radius:8px;padding:10px 14px;margin:0 0 16px;font-size:13px;line-height:1.5;word-break:break-word}
    /* Prompt card (toggled by the header "prompt" button) */
    #prompt-card{margin-bottom:16px}
    .prompt-card-title{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:8px;font-weight:600}
    .prompt{background:var(--deep);border:1px solid var(--border);border-radius:10px;padding:14px;font-family:var(--font-mono);font-size:12px;line-height:1.55;color:var(--text);overflow:auto;white-space:pre-wrap;word-break:break-word;max-height:420px;margin:0}
    .badge.active{border-color:var(--border-accent);color:var(--text-bright)}

    /* Export to PDF: a print-optimised layout (browser "Save as PDF"). Strips
       the app chrome and forces a clean, light, document-style report. */
    @media print {
      header > div:last-child, #gitops-banner, #prompt-card, .footer,
      .prompt-form, .instances, #pf-rerender, #pf-rerender-status, .report-tmpl,
      #sources:empty { display:none !important; }
      html, body { background:#fff !important; color:#111 !important; }
      body::before { display:none !important; }
      header { border:none !important; margin-bottom:6px !important; }
      main { padding:0 !important; max-width:none !important; }
      #title { color:#000 !important; }
      .meta, .description { color:#333 !important; }
      .report { background:#fff !important; border:none !important; padding:0 !important; box-shadow:none !important; color:#111 !important; }
      .report .md-h, .report h1, .report h2, .report h3, .report h4 { color:#000 !important; }
      .report a { color:#000 !important; text-decoration:underline; }
      .report code, .report .md-pre { background:#f3f3f3 !important; border:1px solid #ddd !important; color:#111 !important; }
      .report .md-pre code { border:none !important; }
      .report .md-quote { color:#333 !important; background:#f7f7f7 !important; border-left-color:#bbb !important; }
      .report .md-table th, .report .md-table td { border:1px solid #999 !important; color:#111 !important; }
      .report .md-table th { background:#eee !important; }
      .report .md-table tr:nth-child(even) td { background:#f7f7f7 !important; }
      .report-inputs { border-color:#ccc !important; }
      .input-chip { background:#f3f3f3 !important; border-color:#ddd !important; color:#333 !important; }
      .input-chip b { color:#000 !important; }
      .render-error { color:#8a1f1f !important; background:#fdf1f1 !important; border-color:#e0b4b4 !important; }
      @page { margin: 15mm; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
</head>
<body>
<header>
  <div>
    <h1 id="title">Loading...</h1>
    <div class="meta" id="meta"></div>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-label="Toggle color theme"><span class="theme-toggle-knob"><svg class="tt-sun" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"/></svg><svg class="tt-moon" viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span></button>
    <span class="badge" id="sync-badge">syncing</span>
    <button id="prompt-btn" class="badge" type="button"
      style="cursor:pointer;font-family:inherit;color:var(--text);background:var(--card);display:none;"
      title="Show the prompt this dashboard renders from.">≡ prompt</button>
    <button id="pdf-btn" class="badge" type="button"
      style="cursor:pointer;font-family:inherit;color:var(--text);background:var(--card);display:none;"
      title="Export this dashboard as a PDF (opens your browser's print dialog — choose 'Save as PDF').">⬇ PDF</button>
    <button id="gitops-sync-btn" class="badge" type="button"
      style="cursor:pointer;font-family:inherit;color:var(--text);background:var(--card);display:none;"
      title="Reconcile this dashboard registry with the source repo right now.">⟳ sync now</button>
    <a class="badge" href="/ui/">← agents</a>
  </div>
</header>
<main>
  <div class="description" id="description"></div>
  <div id="gitops-banner" style="display:none;background:rgba(114,151,189,.08);border:1px solid rgba(114,151,189,.4);border-radius:10px;padding:12px 14px;margin-bottom:14px;color:var(--text);font-size:13px;line-height:1.55"></div>
  <div id="prompt-card" style="display:none">
    <div class="prompt-card-title">Prompt</div>
    <pre class="prompt" id="prompt-text"></pre>
  </div>
  <div id="account-panel" style="display:none"></div>
  <div id="sources"></div>
  <div class="footer">
    Auto-refreshes from the server every sync interval. Raw JSON: <a id="raw-link" href="">data.json</a>
  </div>
</main>
<script>
  function escapeHtml(s){const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML}
  function fmtTime(s){if(!s)return '';try{return new Date(s).toLocaleString()}catch(e){return s}}
  function sourceRefToURL(ref){
    if(!ref||typeof ref!=='string')return null;
    const m=ref.match(/^([^/\s]+)\/([^@\s]+)@([^:\s]+):(.+)$/);
    if(!m)return null;
    return 'https://github.com/'+encodeURIComponent(m[1])+'/'+encodeURIComponent(m[2])+'/blob/'+encodeURIComponent(m[3])+'/'+m[4].split('/').map(encodeURIComponent).join('/');
  }

  // ---------- GitOps status / sync-now ----------
  function gitopsStatusLine(st){
    const parts=[];
    parts.push(st.repo+(st.branch?'@'+st.branch:'@<default>'));
    if(st.last_sync){
      const t=new Date(st.last_sync);
      if(!isNaN(t.getTime())&&t.getTime()>0)parts.push('last reconcile '+t.toLocaleString());
    } else {
      parts.push('not yet reconciled');
    }
    if(st.running)parts.push('syncing now…');
    return parts.join(' · ');
  }
  async function refreshGitopsStatus(kind){
    const el=document.getElementById('gitops-status');
    if(!el)return;
    try{
      const r=await fetch('/api/'+kind+'/_gitops',{cache:'no-store'});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const body=await r.json();
      if(!body.enabled||!body.status){
        el.textContent='Sync polling is not configured on this server.';
        el.style.color='var(--text-muted)';
        const btn=document.getElementById('gitops-sync-btn');
        if(btn){btn.disabled=true;btn.style.opacity='.5';btn.style.cursor='not-allowed';btn.title='GitOps sync is not enabled on this server.';}
        return;
      }
      const st=body.status;
      el.textContent=gitopsStatusLine(st);
      el.style.color=st.last_error?'var(--red)':'var(--text-muted)';
      if(st.last_error)el.textContent+=' — error: '+st.last_error;
    } catch(e){
      el.textContent='Could not load sync status: '+e.message;
      el.style.color='var(--red)';
    }
  }
  async function triggerGitopsSync(kind){
    const btn=document.getElementById('gitops-sync-btn');
    const el=document.getElementById('gitops-status');
    if(!btn)return;
    const orig=btn.textContent;
    btn.disabled=true;btn.textContent='⟳ syncing…';btn.style.cursor='wait';
    if(el){el.textContent='Reconciling against the source repo…';el.style.color='var(--text-muted)';}
    try{
      const r=await fetch('/api/'+kind+'/_gitops/sync',{method:'POST'});
      if(!r.ok){const txt=await r.text();throw new Error(txt||('HTTP '+r.status));}
      await refreshGitopsStatus(kind);
      if(typeof load==='function')load();
    } catch(e){
      if(el){el.textContent='Sync failed: '+e.message;el.style.color='var(--red)';}

  // Render text that may contain Slack-style mrkdwn (*bold*, `code`, <url|label>,
  // :emoji:, <br>) into safe HTML.
  function renderRich(text){
    let s = escapeHtml(text);
    // Slack links: <http://url|label> or <http://url>
    s = s.replace(/&lt;(https?:\/\/[^|&\s]+)\|([^&]+?)&gt;/g, '<a href="$1" target="_blank" rel="noopener">$2</a>');
    s = s.replace(/&lt;(https?:\/\/[^&\s]+)&gt;/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    // Literal <br> from upstream (e.g. Chorus summaries)
    s = s.replace(/&lt;br\s*\/?&gt;/gi, '<br>');
    // Bold: *text* (Slack) and **text** (markdown)
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<strong>$2</strong>');
    // Inline code
    s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    // Known emoji shortcodes -> unicode
    const emoji = {
      ':white_check_mark:':'\u2705', ':rotating_light:':'\u{1F6A8}',
      ':grey_question:':'\u2754', ':warning:':'\u26A0\uFE0F',
      ':x:':'\u274C', ':heavy_check_mark:':'\u2714\uFE0F',
    };
    s = s.replace(/:[a-z0-9_+-]+:/gi, m => emoji[m] || m);
    return s;
  }

  // Turn bare URLs in a plain-text string into clickable <a> tags. Input must
  // already be HTML-escaped.
  function linkify(escaped){
    return escaped.replace(/(https?:\/\/[^\s<>"')]+)(?=[)\].,;:!?]*(\s|$))/g,
      '<a href="$1" target="_blank" rel="noopener">$1<\/a>');
  }

  // Render a self-contained, XSS-safe subset of GitHub-flavoured Markdown.
  // Everything is HTML-escaped up front, so no raw markup from the model can
  // reach the DOM; only the transforms below re-introduce tags we control.
  function mdInline(s){
    // s is already HTML-escaped. Order matters: code spans first so their
    // contents are not further transformed.
    const codes = [];
    s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0000'+(codes.length-1)+'\u0000'; });
    // Links [text](url) — only http(s) URLs are allowed.
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
    // Bare URLs.
    s = s.replace(/(^|[\s(])(https?:\/\/[^\s<>()]+)(?=[)\].,;:!?]*(\s|$))/g,
      '$1<a href="$2" target="_blank" rel="noopener">$2<\/a>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    s = s.replace(/(^|[^_])_([^_\n]+)_/g, '$1<em>$2</em>');
    s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
    s = s.replace(/\u0000(\d+)\u0000/g, (m, i) => '<code>'+codes[+i]+'</code>');
    return s;
  }
  function renderMarkdown(md){
    let src = escapeHtml(String(md || ''));
    // Normalize Slack-style links <url|label> and <url> to Markdown [label](url)
    // BEFORE table parsing, so the '|' inside a link is not mistaken for a table
    // column delimiter and the link still renders (the model sometimes emits
    // Slack mrkdwn links even though we ask for Markdown).
    src = src.replace(/&lt;(https?:\/\/[^|\s&<>]+)\|([^&<>]+)&gt;/g, '[$2]($1)');
    src = src.replace(/&lt;(https?:\/\/[^|\s&<>]+)&gt;/g, '[$1]($1)');
    const lines = src.split('\n');
    let html = '', i = 0;
    const isTableSep = s => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/.test(s);
    // Split a table row on unescaped '|' only, then unescape '\|' inside cells.
    // (Uses a placeholder instead of lookbehind for older-Safari compatibility.)
    const splitRow = s => s.replace(/^\s*\|/, '').replace(/\|\s*$/, '')
      .replace(/\\\|/g, '\u0001').split('|').map(c => c.trim().replace(/\u0001/g, '|'));
    while (i < lines.length){
      const line = lines[i];
      if (/^\s*```/.test(line)){                       // fenced code block
        i++; const buf = [];
        while (i < lines.length && !/^\s*```/.test(lines[i])){ buf.push(lines[i]); i++; }
        i++; html += '<pre class="md-pre"><code>'+buf.join('\n')+'</code></pre>';
        continue;
      }
      const h = line.match(/^\s*(#{1,6})\s+(.*?)\s*#*$/);
      if (h){ const lvl = h[1].length; html += '<h'+lvl+' class="md-h">'+mdInline(h[2])+'</h'+lvl+'>'; i++; continue; }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)){ html += '<hr>'; i++; continue; }   // ---
      // GFM table: header row + separator row.
      if (line.indexOf('|') !== -1 && i+1 < lines.length && isTableSep(lines[i+1])){
        const head = splitRow(line);
        i += 2; const rows = [];
        while (i < lines.length && lines[i].indexOf('|') !== -1 && lines[i].trim() !== ''){ rows.push(splitRow(lines[i])); i++; }
        let t = '<table class="md-table"><thead><tr>';
        head.forEach(c => t += '<th>'+mdInline(c)+'</th>');
        t += '</tr></thead><tbody>';
        rows.forEach(r => {
          t += '<tr>';
          const n = head.length;
          for (let k=0;k<n;k++){
            // If a row has more cells than the header (an unescaped '|' inside a
            // value), fold the overflow into the last column rather than dropping it.
            const val = (k === n-1 && r.length > n) ? r.slice(k).join(' | ') : (r[k] || '');
            t += '<td>'+mdInline(val)+'</td>';
          }
          t += '</tr>';
        });
        t += '</tbody></table>'; html += t; continue;
      }
      if (/^\s*>\s?/.test(line)){                        // blockquote
        const buf = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])){ buf.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
        html += '<blockquote class="md-quote">'+mdInline(buf.join('<br>'))+'</blockquote>';
        continue;
      }
      if (/^\s*(\d+)[.)]\s+/.test(line)){                // ordered list
        let t = '<ol class="md-list">';
        while (i < lines.length && /^\s*(\d+)[.)]\s+/.test(lines[i])){ t += '<li>'+mdInline(lines[i].replace(/^\s*(\d+)[.)]\s+/, ''))+'</li>'; i++; }
        t += '</ol>'; html += t; continue;
      }
      if (/^\s*[-*+]\s+/.test(line)){                    // unordered list
        let t = '<ul class="md-list">';
        while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])){ t += '<li>'+mdInline(lines[i].replace(/^\s*[-*+]\s+/, ''))+'</li>'; i++; }
        t += '</ul>'; html += t; continue;
      }
      if (line.trim() === ''){ i++; continue; }          // blank line
      // Paragraph: gather consecutive non-blank, non-structural lines.
      const buf = [];
      while (i < lines.length && lines[i].trim() !== '' &&
             !/^\s*(#{1,6}\s|```|>\s?|[-*+]\s|\d+[.)]\s)/.test(lines[i]) &&
             !(lines[i].indexOf('|') !== -1 && i+1 < lines.length && isTableSep(lines[i+1]))){
        buf.push(lines[i]); i++;
      }
      html += '<p>'+mdInline(buf.join('<br>'))+'</p>';
    }
    return html;
  }

  function renderCell(v){
    if (v === null || v === undefined) return '';
    if (typeof v === 'string') {
      const trimmed = v.length > 400 ? v.slice(0,400)+'…' : v;
      return linkify(escapeHtml(trimmed));
    }
    if (typeof v !== 'object') return escapeHtml(String(v));
    if (Array.isArray(v)) {
      if (v.length === 0) return '<span class="empty">[]</span>';
      // Array of primitives → comma list
      if (v.every(x => x === null || typeof x !== 'object')) {
        const joined = v.map(x => String(x ?? '')).join(', ');
        return escapeHtml(joined.length > 240 ? joined.slice(0,240)+'…' : joined);
      }
      return '<details class="cell"><summary>['+v.length+' items]</summary><pre>'+escapeHtml(JSON.stringify(v,null,2))+'</pre></details>';
    }
    const keys = Object.keys(v);
    if (keys.length === 0) return '<span class="empty">{}</span>';
    return '<details class="cell"><summary>{'+keys.length+' keys}</summary><pre>'+escapeHtml(JSON.stringify(v,null,2))+'</pre></details>';
  }

  function renderContent(content){
    if (content === null || content === undefined) return '<div class="empty">No data.</div>';
    // Structured Datadog metrics payload → Chart.js line chart per site.
    if (content && typeof content === 'object' && !Array.isArray(content) && content.kind === 'datadog_metrics') {
      return renderMetricsPayload(content);
    }
    if (typeof content === 'string') {
      // Heuristic: if the text contains Slack markup, render rich; otherwise plain pre.
      if (/[*<`:]/.test(content)) {
        return '<div class="rich">' + renderRich(content) + '</div>';
      }
      return '<pre class="content">' + escapeHtml(content) + '</pre>';
    }
    if (Array.isArray(content)) {
      if (content.length === 0) return '<div class="empty">No results.</div>';
      const first = content[0];
      if (first && typeof first === 'object' && !Array.isArray(first)) {
        const keys = Array.from(content.reduce((s,r)=>{Object.keys(r||{}).forEach(k=>s.add(k));return s}, new Set())).slice(0, 10);
        const rows = content.slice(0, 100).map(r => '<tr>' + keys.map(k => '<td>' + renderCell(r[k]) + '</td>').join('') + '</tr>').join('');
        return '<div class="table-wrap"><table><thead><tr>' + keys.map(k=>'<th>'+escapeHtml(k)+'</th>').join('') + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
          + (content.length > 100 ? '<div class="empty">Showing 100 of ' + content.length + ' rows.</div>' : '');
      }
      return '<pre class="content">' + escapeHtml(JSON.stringify(content, null, 2)) + '</pre>';
    }
    if (typeof content === 'object') {
      return '<pre class="content">' + escapeHtml(JSON.stringify(content, null, 2)) + '</pre>';
    }
    return '<pre class="content">' + escapeHtml(String(content)) + '</pre>';
  }

  // Chart.js instances keyed by canvas DOM id so we can destroy them on re-render.
  const metricsCharts = {};
  let metricsChartSeq = 0;

  // Chart ink colors that follow the active theme.
  function inkTick(){ return document.documentElement.dataset.theme === 'light' ? '#5d6671' : '#8a93a3'; }
  function inkGrid(){ return document.documentElement.dataset.theme === 'light' ? 'rgba(40,52,70,0.08)' : 'rgba(143,152,168,0.07)'; }
  function applyChartTheme(ch){
    if (!ch) return;
    const o = ch.options;
    if (o.plugins && o.plugins.legend && o.plugins.legend.labels) o.plugins.legend.labels.color = inkTick();
    for (const ax of Object.values(o.scales || {})) {
      if (ax.ticks) ax.ticks.color = inkTick();
      if (ax.grid) ax.grid.color = inkGrid();
      if (ax.title && ax.title.display) ax.title.color = inkTick();
    }
    ch.update('none');
  }

  // Deterministic-ish color from string hash, for series lines.
  function colorForScope(scope, i){
    const palette = [
      '#7297bd', '#83b08a', '#c0a368', '#c08a66', '#8f87b8', '#76a8b8',
      '#b08299', '#94a36a', '#c47f7f', '#7e95b5', '#b59a66', '#6fa39b',
    ];
    if (!scope) return palette[i % palette.length];
    let h = 0;
    for (let k = 0; k < scope.length; k++) h = (h * 31 + scope.charCodeAt(k)) | 0;
    return palette[Math.abs(h) % palette.length];
  }

  function fmtMetricNum(v){
    if (v === null || v === undefined || Number.isNaN(v)) return '—';
    const a = Math.abs(v);
    if (a === 0) return '0';
    if (a >= 1e12) return (v/1e12).toFixed(2) + 'T';
    if (a >= 1e9)  return (v/1e9).toFixed(2) + 'G';
    if (a >= 1e6)  return (v/1e6).toFixed(2) + 'M';
    if (a >= 1e3)  return (v/1e3).toFixed(2) + 'K';
    if (a >= 10) return v.toFixed(2);
    if (a >= 1) return v.toFixed(3);
    return v.toFixed(4);
  }

  // Infer a display unit for a datadog_query_metrics site so we can render
  // meaningful values (cores / millicores / %, MiB / GiB, etc.) instead of
  // raw nanocores or bytes. Falls back to "raw" SI formatting when the query
  // shape is unfamiliar.
  function inferMetricUnit(site){
    const q = String(site.query || '').toLowerCase();
    let maxAbs = 0;
    for (const s of (site.series || [])) {
      for (const k of ['avg','min','max','last']) {
        const v = s[k];
        if (typeof v === 'number' && Number.isFinite(v)) {
          const a = Math.abs(v);
          if (a > maxAbs) maxAbs = a;
        }
      }
    }
    const isCPU = /kubernetes\.cpu\./.test(q);
    const isMem = /kubernetes\.memory\./.test(q);
    // CPU usage.total is reported in nanocores (1 core = 1e9), while
    // requests/limits/capacity/allocatable are reported in cores directly.
    // Without this split, a 0.25-core request renders as "0.000m".
    const isCPUCoresNative = isCPU && /\.(requests|limits|capacity|allocatable)\b/.test(q);
    const endsMul100 = /\*\s*100\s*$/.test(q.trim());
    let kind = 'raw';
    let warning = '';
    if (isCPU && endsMul100 && maxAbs <= 1000) {
      kind = 'percent';
    } else if (isCPU && endsMul100 && maxAbs > 1000) {
      kind = 'cores';
      warning = "Query ends with '* 100' (intended as % of CPU requests), but the values are nanocore-sized. This usually means kubernetes.cpu.requests is missing or zero for these workloads, so the division degenerated into the raw usage numerator. Showing CPU usage in cores instead of percent.";
    } else if (isCPUCoresNative) {
      kind = 'cores_native';
    } else if (isCPU) {
      kind = 'cores';
    } else if (isMem) {
      kind = 'bytes';
    } else if (endsMul100 && maxAbs <= 1000) {
      kind = 'percent';
    }
    return { kind, warning, maxAbs };
  }

  function unitDisplayLabel(u){
    switch (u.kind) {
      case 'percent':       return '%';
      case 'cores':         return 'CPU cores';
      case 'cores_native':  return 'CPU cores';
      case 'bytes':         return 'bytes (auto-scaled)';
      default:              return 'native units';
    }
  }

  function formatByUnit(v, u){
    if (v === null || v === undefined || Number.isNaN(v) || !Number.isFinite(v)) return '—';
    if (u.kind === 'percent') {
      return (Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(2)) + '%';
    }
    if (u.kind === 'cores') {
      // incoming values are nanocores (1 core = 1e9 nanocores)
      const cores = v / 1e9;
      const a = Math.abs(cores);
      if (a === 0) return '0';
      if (a >= 1)     return cores.toFixed(2) + ' cores';
      if (a >= 0.001) return (cores * 1000).toFixed(0) + 'm';
      return (cores * 1000).toFixed(3) + 'm';
    }
    if (u.kind === 'cores_native') {
      // incoming values are already in cores (requests/limits)
      const cores = v;
      const a = Math.abs(cores);
      if (a === 0) return '0';
      if (a >= 1)     return cores.toFixed(2) + ' cores';
      if (a >= 0.001) return (cores * 1000).toFixed(0) + 'm';
      return (cores * 1000).toFixed(3) + 'm';
    }
    if (u.kind === 'bytes') {
      const a = Math.abs(v);
      if (a >= 1024 ** 4) return (v / 1024 ** 4).toFixed(2) + ' TiB';
      if (a >= 1024 ** 3) return (v / 1024 ** 3).toFixed(2) + ' GiB';
      if (a >= 1024 ** 2) return (v / 1024 ** 2).toFixed(2) + ' MiB';
      if (a >= 1024)      return (v / 1024).toFixed(2) + ' KiB';
      return v.toFixed(0) + ' B';
    }
    return fmtMetricNum(v);
  }

  function chartScale(u){
    if (u.kind === 'cores') return { div: 1e9, label: 'cores' };
    if (u.kind === 'cores_native') return { div: 1, label: 'cores' };
    if (u.kind === 'bytes') {
      const a = u.maxAbs || 0;
      if (a >= 1024 ** 3) return { div: 1024 ** 3, label: 'GiB' };
      if (a >= 1024 ** 2) return { div: 1024 ** 2, label: 'MiB' };
      if (a >= 1024)      return { div: 1024,      label: 'KiB' };
      return { div: 1, label: 'bytes' };
    }
    if (u.kind === 'percent') return { div: 1, label: '%' };
    return { div: 1, label: '' };
  }

  function describeWindow(fromMs, toMs){
    if (!fromMs || !toMs) return '';
    const ms = Math.max(0, toMs - fromMs);
    const mins = ms / 60000;
    if (mins < 90)  return Math.round(mins) + ' min';
    const hrs = ms / 3600000;
    if (hrs < 48)   return (hrs % 1 === 0 ? hrs.toFixed(0) : hrs.toFixed(1)) + ' h';
    return (hrs / 24).toFixed(1) + ' d';
  }

  // Render a short "what are we looking at" banner above each chart:
  // series count, window, top/bottom scope by avg, plus any unit warning.
  function metricsSummaryIntro(site, u){
    const series = site.series || [];
    if (series.length === 0) return '';
    const sorted = [...series]
      .filter(s => typeof s.avg === 'number' && Number.isFinite(s.avg))
      .sort((a, b) => b.avg - a.avg);
    const top = sorted[0];
    const bot = sorted[sorted.length - 1];
    const win = describeWindow(site.from_date, site.to_date);
    const bits = [];
    bits.push('<strong>' + series.length + '</strong> series' + (win ? ' over the last <strong>' + win + '</strong>' : ''));
    if (top) bits.push('highest avg: <strong>' + escapeHtml(top.scope || '*') + '</strong> (' + formatByUnit(top.avg, u) + ')');
    if (bot && bot !== top) bits.push('lowest avg: <strong>' + escapeHtml(bot.scope || '*') + '</strong> (' + formatByUnit(bot.avg, u) + ')');
    if (site.truncated) bits.push('+' + site.truncated + ' more hidden');
    const intro = '<div class="metrics-summary-intro empty" style="margin:6px 0 8px">Showing ' + bits.join(' · ') + '. Values formatted as ' + unitDisplayLabel(u) + '.</div>';
    const warn = u.warning
      ? '<div class="source-error" style="background:rgba(199,154,94,.1);border-color:rgba(199,154,94,.45);color:var(--amber);margin:6px 0 8px">⚠ ' + escapeHtml(u.warning) + '</div>'
      : '';
    return warn + intro;
  }

  // Build a URL that opens the Datadog Metrics Explorer on the right site with
  // the query's time window pre-set. Datadog's explorer encodes the actual
  // query expression in an opaque hash fragment, so the query cannot be
  // pre-filled via URL params — we pair this link with a "Copy query" button.
  function datadogExploreURL(site, fromMs, toMs){
    const host = site && site.indexOf('.') !== -1 ? site : 'datadoghq.com';
    const params = new URLSearchParams({ paused: 'true' });
    if (fromMs) params.set('start', String(fromMs));
    if (toMs) params.set('end', String(toMs));
    return 'https://app.' + host + '/metric/explorer?' + params.toString();
  }

  function copyToClipboard(text, btn){
    const done = () => {
      if (!btn) return;
      const prev = btn.textContent;
      btn.textContent = 'Copied';
      setTimeout(() => { btn.textContent = prev; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, done);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta); done();
    }
  }
  window.__copyMetricsQuery = function(btn){
    const q = btn && btn.getAttribute('data-query');
    if (q) copyToClipboard(q, btn);
  };
  // Auto-copy the query when opening Datadog so the user just pastes it into
  // the explorer's query box. Datadog does not accept arbitrary query
  // expressions via URL (the state is in an opaque LZString hash fragment),
  // so copy+paste is the only reliable path.
  window.__openInDatadog = function(link){
    const q = link && link.getAttribute('data-query');
    if (q) copyToClipboard(q, null);
    return true; // let the anchor navigate
  };

  // Render a datadog_query_metrics source payload: per-site chart + summary table.
  function renderMetricsPayload(payload){
    const sites = payload.sites || [];
    if (sites.length === 0) return '<div class="empty">No metric series returned.</div>';
    // Pair each site with the canvas id used in its HTML so the async wiring
    // below can find exactly the right element (the global seq counter keeps
    // ticking while other source cards in the same dashboard render).
    const canvasIds = sites.map(() => 'metrics-chart-' + (++metricsChartSeq));
    const blocks = sites.map((site, siteIdx) => {
      const canvasId = canvasIds[siteIdx];
      const series = site.series || [];
      const unit = inferMetricUnit(site);
      const unitLabel = site.unit ? escapeHtml(site.unit) : escapeHtml(unitDisplayLabel(unit));
      const unitBadge = ' (' + unitLabel + ')';
      const errorBlock = site.error ? '<div class="source-error">' + escapeHtml(site.error) + '</div>' : '';
      const ddURL = datadogExploreURL(site.site, site.from_date, site.to_date);
      const qAttr = escapeHtml(site.query || '');
      const header =
        '<h4>[' + escapeHtml(site.label || site.site || '') + ']' + unitBadge +
        ' <span class="q" title="' + qAttr + '">' + qAttr + '</span>' +
        ' <button type="button" class="dd-link" data-query="' + qAttr + '" onclick="__copyMetricsQuery(this)">Copy query</button>' +
        ' <a href="' + ddURL + '" target="_blank" rel="noopener" class="dd-link" data-query="' + qAttr + '" onclick="__openInDatadog(this)" title="Copies the query to your clipboard, then opens Datadog Metrics Explorer. Paste into the query box.">Copy &amp; Open in Datadog \u2197</a>' +
        '</h4>';
      if (errorBlock && series.length === 0) {
        return '<div class="metrics-site">' + header + errorBlock + '</div>';
      }
      if (series.length === 0) {
        return '<div class="metrics-site">' + header +
          '<div class="empty" style="margin-top:8px">No data returned. The metric name may not exist in this Datadog site, the tag filter may match zero series, or the time window may be empty. Try the <strong>Open in Datadog</strong> link above to verify the query, then adjust the metric or tags.</div>' +
          '</div>';
      }
      const intro = metricsSummaryIntro(site, unit);
      let summaryRows = '';
      if (series.length > 0) {
        const legend =
          '<div class="empty" style="margin:4px 0 8px">' +
          'Each row is one tag group. Values are in <strong>' + unitLabel + '</strong>. ' +
          '<strong>avg / min / max / last</strong> are computed across the ' +
          'query window (<strong>n</strong> = sample count). Rows are sorted by <strong>avg</strong> desc. ' +
          'The chart above plots the same series over time.' +
          '</div>';
        summaryRows = '<div class="metrics-summary">' + legend +
          '<div class="table-wrap"><table><thead><tr>' +
          '<th title="Tag combination for this series">scope</th>' +
          '<th title="Mean value across the window">avg</th>' +
          '<th title="Minimum value in the window">min</th>' +
          '<th title="Maximum value in the window">max</th>' +
          '<th title="Most recent data point">last</th>' +
          '<th title="Number of non-null samples">n</th>' +
          '</tr></thead><tbody>' +
          series.map(s => '<tr>' +
            '<td>' + escapeHtml(s.scope || '*') + '</td>' +
            '<td>' + formatByUnit(s.avg, unit) + '</td>' +
            '<td>' + formatByUnit(s.min, unit) + '</td>' +
            '<td>' + formatByUnit(s.max, unit) + '</td>' +
            '<td>' + formatByUnit(s.last, unit) + '</td>' +
            '<td>' + (s.count ?? 0) + '</td>' +
          '</tr>').join('') +
          '</tbody></table></div>' +
          (site.truncated ? '<div class="empty" style="margin-top:6px">… and ' + site.truncated + ' more series (sorted by avg desc; increase top_n to see more)</div>' : '') +
          '</div>';
      }
      return '<div class="metrics-site">' +
        header +
        errorBlock +
        intro +
        '<div class="metrics-chart"><canvas id="' + canvasId + '"></canvas></div>' +
        summaryRows +
        '</div>';
    }).join('');

    // Defer Chart.js wiring until the new markup is attached to the DOM.
    // requestAnimationFrame ensures layout has committed so the canvas has a
    // non-zero size; a bare setTimeout(...,0) could fire before the browser
    // has realized the newly-inserted `.metrics-chart` container.
    const wire = () => {
      sites.forEach((site, idx) => {
        const canvasId = canvasIds[idx];
        const canvas = document.getElementById(canvasId);
        if (!canvas) {
          console.warn('[metrics] canvas missing for', canvasId);
          return;
        }
        if (typeof Chart === 'undefined') {
          console.warn('[metrics] Chart.js not loaded; skipping', canvasId);
          return;
        }
        if (metricsCharts[canvasId]) { metricsCharts[canvasId].destroy(); }
        const unit = inferMetricUnit(site);
        const scale = chartScale(unit);
        const datasets = (site.series || []).map((s, i) => ({
          label: s.scope || '*',
          data: (s.points || []).map(p => ({ x: p[0], y: (scale.div === 1 ? p[1] : p[1] / scale.div) })),
          borderColor: colorForScope(s.scope || String(i), i),
          backgroundColor: colorForScope(s.scope || String(i), i) + '33',
          borderWidth: 1.5,
          pointRadius: 0,
          pointHoverRadius: 3,
          tension: 0.25,
          spanGaps: true,
        }));
        try {
          metricsCharts[canvasId] = new Chart(canvas.getContext('2d'), {
          type: 'line',
          data: { datasets },
          options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'nearest', intersect: false },
            plugins: {
              legend: {
                display: datasets.length <= 12,
                labels: { color: inkTick(), boxWidth: 10, font: { size: 10 } },
                position: 'bottom',
              },
              tooltip: {
                callbacks: {
                  title: items => items.length ? new Date(items[0].parsed.x).toLocaleString() : '',
                  label: item => (item.dataset.label || '') + ': ' + formatByUnit(item.parsed.y * scale.div, unit),
                },
              },
            },
            scales: {
              x: {
                type: 'time',
                time: { tooltipFormat: 'MMM d, HH:mm' },
                ticks: { color: inkTick(), maxRotation: 0, autoSkipPadding: 20 },
                grid: { color: inkGrid() },
              },
              y: {
                ticks: { color: inkTick() },
                grid: { color: inkGrid() },
                beginAtZero: true,
                title: scale.label
                  ? { display: true, text: scale.label, color: inkTick() }
                  : { display: false },
              },
            },
          },
          });
        } catch (err) {
          console.error('[metrics] Chart.js init failed for ' + canvasId, err);
        }
      });
    };
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(() => requestAnimationFrame(wire));
    } else {
      setTimeout(wire, 0);
    }
    return blocks;
  }

  // ---------- Prompt-driven dashboards (templates + instances) ----------
  function promptInputs(prompt){
    const re = /\{\{\s*([A-Za-z0-9_]+)\s*\}\}/g;
    const seen = {}, out = []; let m;
    while ((m = re.exec(prompt || ''))) {
      const n = m[1], k = n.toUpperCase();
      if (!seen[k]) { seen[k] = true; out.push(n); }
    }
    return out;
  }

  function renderPromptDashboard(d, panel){
    panel.style.display = 'block';
    document.getElementById('sources').innerHTML = '';
    const isInstance = !!d.template_id;
    const inputs = promptInputs(d.prompt);
    const badge = document.getElementById('sync-badge');

    if (!isInstance && inputs.length > 0) {
      // Template with declared inputs: render form + list of instances.
      if (badge) { badge.textContent = 'template'; badge.className = 'badge'; }
      // Don't rebuild the form on the 15s poll — it would wipe what the user
      // is typing. Just refresh the instance list.
      if (document.getElementById('pf-render')) { loadInstances(d); return; }
      const fields = inputs.map(name =>
        '<div class="form-row"><label>' + escapeHtml(name) + '</label>' +
        '<input type="text" data-input="' + escapeHtml(name) + '" autocomplete="off" placeholder="' + escapeHtml(name) + '" /></div>'
      ).join('');
      const iv = escapeHtml(d.sync_interval || '5m');
      panel.innerHTML =
        '<div class="report"><div class="prompt-form">' +
          '<h3>Render this dashboard</h3>' +
          '<p class="empty" style="margin:0 0 14px">Fill in the inputs and render a live instance. It auto-refreshes every ' + iv + '.</p>' +
          fields +
          '<div class="form-row"><label>Refresh interval <span class="opt">(optional, e.g. 5m, 1h)</span></label>' +
            '<input type="text" id="pf-interval" autocomplete="off" placeholder="' + iv + '" /></div>' +
          '<div class="form-actions"><button id="pf-render" class="render-btn" type="button">▶ render</button>' +
            '<span id="pf-status" class="pf-status"></span></div>' +
        '</div><div class="instances" id="pf-instances"><h3>Rendered instances</h3>' +
          '<div class="empty">Loading…</div></div></div>';
      wirePromptForm(d);
      loadInstances(d);
      return;
    }

    // Instance or self-contained (placeholder-free) prompt dashboard: show report.
    if (badge) {
      if (d.last_error) { badge.textContent = 'error'; badge.className = 'badge err'; }
      else if (d.markdown) { badge.textContent = 'live'; badge.className = 'badge ok'; }
      else { badge.textContent = 'rendering'; badge.className = 'badge'; }
    }
    let head = '';
    if (isInstance && d.inputs) {
      const chips = Object.keys(d.inputs).sort().map(k =>
        '<span class="input-chip"><b>' + escapeHtml(k) + '</b>: ' + escapeHtml(d.inputs[k]) + '</span>'
      ).join(' ');
      const tmplURL = '/' + encodeURIComponent(d.agent) + '/dashboard/' + encodeURIComponent(d.template_id);
      head = '<div class="report-inputs">' + chips +
        '<button id="pf-rerender" class="rerender-btn" type="button" title="Re-render this instance now with its saved inputs (uses the current template prompt).">▶ re-render</button>' +
        '<span id="pf-rerender-status" class="pf-status"></span>' +
        '<a class="report-tmpl" href="' + tmplURL + '">↑ template</a></div>';
    }
    // Surface a failed render so the user knows the report is stale/missing.
    let errBanner = '';
    if (d.last_error) {
      const when = d.last_sync ? ' (' + fmtTime(d.last_sync) + ')' : '';
      errBanner = '<div class="render-error"><strong>Last render failed</strong>' + escapeHtml(when) +
        ': ' + escapeHtml(d.last_error) +
        (d.markdown && d.markdown.trim() ? ' — showing the previous successful report below.' : '') + '</div>';
    }
    const body = (d.markdown && d.markdown.trim())
      ? renderMarkdown(d.markdown)
      : (d.last_error
          ? ''
          : '<div class="empty">Rendering… this can take up to a minute. This page refreshes automatically.</div>');
    panel.innerHTML = '<div class="report">' + head + errBanner + body + '</div>';
    wireRerender(d);
  }

  // Re-render an existing instance in place with its saved inputs. Posts to the
  // parent template's render endpoint (same instance id = same slug), so the
  // report is rebuilt with the current template prompt. Fire-and-forget: the
  // 15s poll picks up the fresh Markdown when the render finishes.
  function wireRerender(d){
    const btn = document.getElementById('pf-rerender');
    if (!btn) return;
    btn.addEventListener('click', async () => {
      const status = document.getElementById('pf-rerender-status');
      const orig = btn.textContent;
      btn.disabled = true; btn.textContent = '▶ re-rendering…';
      if (status) { status.textContent = ''; status.style.color = 'var(--text-muted)'; }
      try {
        const res = await fetch('/api/dashboards/' + encodeURIComponent(d.agent) + '/' + encodeURIComponent(d.template_id) + '/render', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ inputs: d.inputs || {}, interval: d.sync_interval || '' }),
        });
        if (!res.ok) { const t = await res.text(); throw new Error(t || ('HTTP ' + res.status)); }
        if (status) status.textContent = 'queued — refreshing when ready…';
      } catch (e) {
        btn.disabled = false; btn.textContent = orig;
        if (status) { status.textContent = 'Re-render failed: ' + e.message; status.style.color = 'var(--red)'; }
      }
    });
  }

  function wirePromptForm(d){
    const btn = document.getElementById('pf-render');
    if (!btn) return;
    btn.addEventListener('click', async () => {
      const inputs = {};
      document.querySelectorAll('#account-panel input[data-input]').forEach(el => {
        inputs[el.getAttribute('data-input')] = el.value.trim();
      });
      const status = document.getElementById('pf-status');
      const missing = Object.keys(inputs).filter(k => !inputs[k]);
      if (missing.length) { status.textContent = 'Fill in: ' + missing.join(', '); status.style.color = 'var(--red)'; return; }
      const intervalEl = document.getElementById('pf-interval');
      const interval = intervalEl ? intervalEl.value.trim() : '';
      const orig = btn.textContent;
      btn.disabled = true; btn.textContent = '▶ rendering…'; status.textContent = '';
      try {
        const res = await fetch('/api/dashboards/' + encodeURIComponent(d.agent) + '/' + encodeURIComponent(d.id) + '/render', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ inputs: inputs, interval: interval }),
        });
        if (!res.ok) { const t = await res.text(); throw new Error(t || ('HTTP ' + res.status)); }
        const body = await res.json();
        window.location.pathname = body.view_url; // the instance page polls until markdown lands
      } catch (e) {
        status.textContent = 'Render failed: ' + e.message; status.style.color = 'var(--red)';
        btn.disabled = false; btn.textContent = orig;
      }
    });
  }

  async function loadInstances(d){
    const box = document.getElementById('pf-instances');
    if (!box) return;
    try {
      const res = await fetch('/api/dashboards?agent=' + encodeURIComponent(d.agent), { cache: 'no-store' });
      if (!res.ok) return;
      const list = await res.json();
      const insts = (list || []).filter(x => x.template_id === d.id);
      if (!insts.length) { box.innerHTML = '<h3>Rendered instances</h3><div class="empty">None yet — render one above.</div>'; return; }
      insts.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
      const rows = insts.map(x => {
        const label = (x.inputs && Object.keys(x.inputs).length)
          ? Object.keys(x.inputs).sort().map(k => escapeHtml(x.inputs[k])).join(' · ')
          : escapeHtml(x.name || x.id);
        const when = x.last_sync ? fmtTime(x.last_sync) : 'pending';
        const url = '/' + encodeURIComponent(x.agent) + '/dashboard/' + encodeURIComponent(x.id);
        return '<a class="inst-row" href="' + url + '"><span class="inst-label">' + label +
          '</span><span class="inst-when">' + when + '</span></a>';
      }).join('');
      box.innerHTML = '<h3>Rendered instances</h3>' + rows;
    } catch (e) { /* best-effort */ }
  }

  async function load(){
    const path = window.location.pathname.replace(/\/$/, '');
    const dataURL = path + '/data.json';
    document.getElementById('raw-link').href = dataURL;
    try {
      const r = await fetch(dataURL, { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      document.title = d.name + ' — arbetern';
      document.getElementById('title').textContent = d.name;
      document.getElementById('meta').textContent =
        'agent: ' + d.agent + '  ·  every ' + d.sync_interval +
        '  ·  last sync: ' + (d.last_sync ? fmtTime(d.last_sync) : 'pending');
      document.getElementById('description').textContent = d.description || '';
      const gitopsBanner = document.getElementById('gitops-banner');
      const gitopsSyncBtn = document.getElementById('gitops-sync-btn');
      if (d.source === 'gitops') {
        const link = sourceRefToURL(d.source_ref);
        const sourceLine = link
          ? 'Edit it at <a href="' + link + '" target="_blank" rel="noopener">' + escapeHtml(d.source_ref) + '</a>.'
          : 'Edits here would be overwritten on the next sync.';
        gitopsBanner.style.display = 'block';
        gitopsBanner.innerHTML =
          '<div><strong>Managed via GitOps.</strong> ' + sourceLine + '</div>' +
          '<div id="gitops-status" style="font-size:12px;color:var(--text-muted);margin-top:6px">checking sync status…</div>';
        gitopsSyncBtn.style.display = '';
        if (!gitopsSyncBtn.dataset.bound) {
          gitopsSyncBtn.addEventListener('click', () => triggerGitopsSync('dashboards'));
          gitopsSyncBtn.dataset.bound = '1';
        }
        refreshGitopsStatus('dashboards');
      } else {
        gitopsBanner.style.display = 'none';
        gitopsSyncBtn.style.display = 'none';
      }
      const badge = document.getElementById('sync-badge');
      if (d.last_error) { badge.textContent = 'error'; badge.className = 'badge err'; }
      else if (d.last_sync) { badge.textContent = 'live'; badge.className = 'badge ok'; }

      // Prompt dashboards expose their source prompt behind a toggle button
      // (like a workflow's Prompt card), so you can see what the report renders
      // from without opening the raw JSON.
      const promptBtn = document.getElementById('prompt-btn');
      const promptCard = document.getElementById('prompt-card');
      if (d.kind === 'prompt' && d.prompt) {
        document.getElementById('prompt-text').textContent = d.prompt;
        promptBtn.style.display = '';
        if (!promptBtn.dataset.bound) {
          promptBtn.addEventListener('click', () => {
            const show = promptCard.style.display === 'none';
            promptCard.style.display = show ? 'block' : 'none';
            promptBtn.classList.toggle('active', show);
          });
          promptBtn.dataset.bound = '1';
        }
      } else {
        promptBtn.style.display = 'none';
        promptCard.style.display = 'none';
      }

      // Export to PDF: shown once there is a rendered report to export.
      const pdfBtn = document.getElementById('pdf-btn');
      if (d.kind === 'prompt' && d.markdown && d.markdown.trim()) {
        pdfBtn.style.display = '';
        if (!pdfBtn.dataset.bound) {
          pdfBtn.addEventListener('click', () => window.print());
          pdfBtn.dataset.bound = '1';
        }
      } else {
        pdfBtn.style.display = 'none';
      }

      // Prompt-driven dashboard: a template (render form) or an instance (report).
      const acctPanel = document.getElementById('account-panel');
      if (d.kind === 'prompt') {
        renderPromptDashboard(d, acctPanel);
        return;
      }
      acctPanel.style.display = 'none';

      const sources = document.getElementById('sources');
      sources.innerHTML = '';
      (d.sources || []).forEach((s, i) => {
        const label = s.name || (s.type + '_' + i);
        const res = (d.data || {})[label] || {};
        const card = document.createElement('div');
        card.className = 'source';
        const header = '<div class="source-header"><div><div class="source-title">' + escapeHtml(label) +
          ' <span class="source-type">' + escapeHtml(s.type) + '</span></div></div>' +
          '<div class="source-meta">' + (res.fetched_at ? fmtTime(res.fetched_at) : 'pending') +
          (res.duration_ms != null ? ' · ' + res.duration_ms + 'ms' : '') + '</div></div>';
        const body = res.error
          ? '<div class="source-error">' + escapeHtml(res.error) + '</div>'
          : renderContent(res.content);
        card.innerHTML = header + body;
        sources.appendChild(card);
      });
    } catch (err) {
      document.getElementById('title').textContent = 'Failed to load';
      document.getElementById('meta').textContent = String(err);
      document.getElementById('sync-badge').textContent = 'error';
      document.getElementById('sync-badge').className = 'badge err';
    }
  }

  // Theme toggle (dark ⇆ light, persisted).
  (function(){
    const btn = document.getElementById('theme-toggle');
    function label(t){
      btn.title = 'Switch to ' + (t === 'light' ? 'dark' : 'light') + ' theme';
      btn.setAttribute('aria-checked', String(t !== 'light'));
    }
    btn.addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem('arbetern-theme', next); } catch (e) {}
      label(next);
      Object.values(metricsCharts).forEach(applyChartTheme);
    });
    label(document.documentElement.dataset.theme || 'dark');
  })();

  load();
  // Poll once every 15s so users see refreshed data without reloading.
  setInterval(load, 15000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>arbetern — dashboard</title>
  <style>
    :root {
      --bg:#000; --surface:#070707; --card:#0c0c0c; --card-hover:#111;
      --border:#1a1a1a; --border-accent:#242424;
      --text:#b0b8c1; --text-muted:#6b7685; --accent:#4a8ad4; --green:#2e9444; --red:#c44040;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    header{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:10}
    header h1{font-size:18px;font-weight:700;letter-spacing:-.3px}
    header .meta{font-size:12px;color:var(--text-muted)}
    header .badge{font-size:11px;padding:3px 10px;border-radius:20px;background:var(--card);border:1px solid var(--border);color:var(--text-muted)}
    header .badge.ok{color:var(--green);border-color:rgba(46,148,68,.25)}
    header .badge.err{color:var(--red);border-color:rgba(196,64,64,.25)}
    main{max-width:1400px;margin:0 auto;padding:28px 24px}
    .description{color:var(--text-muted);font-size:13px;margin-bottom:24px;max-width:820px;line-height:1.6}
    .source{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:18px}
    .source-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap}
    .source-title{font-size:15px;font-weight:600;color:var(--text)}
    .source-type{font-family:'SF Mono','Fira Code',monospace;font-size:11px;color:var(--accent);padding:2px 8px;border-radius:4px;background:rgba(74,138,212,.08)}
    .source-meta{font-size:11px;color:var(--text-muted)}
    .source-error{font-size:13px;color:var(--red);background:rgba(196,64,64,.05);border:1px solid rgba(196,64,64,.2);border-radius:8px;padding:10px 14px;font-family:'SF Mono','Fira Code',monospace}
    pre.content{background:#050505;border:1px solid var(--border);border-radius:8px;padding:14px;font-family:'SF Mono','Fira Code',monospace;font-size:12px;line-height:1.5;color:var(--text);overflow-x:auto;white-space:pre-wrap;word-break:break-word;max-height:520px}
    .rich{background:#050505;border:1px solid var(--border);border-radius:8px;padding:14px;font-size:13px;line-height:1.55;color:var(--text);overflow-x:auto;white-space:pre-wrap;word-break:break-word;max-height:640px}
    .rich strong{color:#e3e8ee;font-weight:600}
    .rich code{font-family:'SF Mono','Fira Code',monospace;font-size:12px;background:#111;padding:1px 5px;border-radius:3px;color:#d6dde3}
    .rich hr{border:0;border-top:1px solid var(--border);margin:10px 0}
    details.cell{display:inline-block;max-width:100%}
    details.cell summary{cursor:pointer;color:var(--accent);font-size:12px;list-style:none}
    details.cell summary::-webkit-details-marker{display:none}
    details.cell pre{margin-top:6px;background:#050505;border:1px solid var(--border);border-radius:6px;padding:8px;font-family:'SF Mono','Fira Code',monospace;font-size:11px;white-space:pre-wrap;max-height:260px;overflow:auto}
    .table-wrap{width:100%;overflow-x:auto;border:1px solid var(--border);border-radius:8px;background:#050505}
    table{width:100%;border-collapse:collapse;font-size:13px;table-layout:auto}
    th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top;max-width:360px;overflow-wrap:anywhere;word-break:break-word;white-space:normal}
    th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);font-weight:600;background:#080808;position:sticky;top:0}
    td a{word-break:break-all}
    tr:last-child td{border-bottom:none}
    .empty{color:var(--text-muted);font-size:13px;font-style:italic;padding:6px 0}
    .footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--border);color:var(--text-muted);font-size:11px;text-align:center}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}

    /* Account-health summary panel (Kind="account") */
    .account{display:grid;grid-template-columns:260px 1fr;gap:20px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:24px}
    .score-box{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;border-radius:10px;background:#050505;border:1px solid var(--border)}
    .score-box .num{font-size:54px;font-weight:800;line-height:1;letter-spacing:-1px}
    .score-box .band{margin-top:10px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
    .band-green{background:rgba(46,148,68,.15);color:#57c97a}
    .band-yellow{background:rgba(222,184,60,.15);color:#e7cb5e}
    .band-orange{background:rgba(222,128,40,.15);color:#eda760}
    .band-red{background:rgba(196,64,64,.15);color:#e07c7c}
    .score-box.band-green .num{color:#57c97a}
    .score-box.band-yellow .num{color:#e7cb5e}
    .score-box.band-orange .num{color:#eda760}
    .score-box.band-red .num{color:#e07c7c}
    .lists{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .list-block h3{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:8px;font-weight:600}
    .list-block ul{list-style:none;padding:0;margin:0}
    .list-block li{padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;line-height:1.45}
    .list-block li:last-child{border-bottom:none}
    .signal-chart{margin-top:18px;background:#050505;border:1px solid var(--border);border-radius:10px;padding:14px;grid-column:1 / -1}
    canvas#signal-chart{max-height:220px}
    /* Datadog metrics (datadog_query_metrics source) chart widgets. */
    .metrics-site{margin-bottom:18px}
    .metrics-site:last-child{margin-bottom:0}
    .metrics-site h4{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin:0 0 8px;font-weight:600;display:flex;gap:10px;align-items:center}
    .metrics-site h4 .q{font-family:'SF Mono','Fira Code',monospace;font-size:11px;color:var(--accent);background:rgba(74,138,212,.08);padding:2px 8px;border-radius:4px;text-transform:none;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%}
    .metrics-site h4 .dd-link{margin-left:auto;font-size:11px;color:var(--accent);text-transform:none;letter-spacing:0;font-weight:500;padding:2px 8px;border:1px solid var(--border);border-radius:4px;background:var(--card);cursor:pointer;font-family:inherit}
    .metrics-site h4 .dd-link + .dd-link{margin-left:6px}
    .metrics-site h4 .dd-link:hover{text-decoration:none;background:var(--card-hover)}
    .metrics-chart{background:#050505;border:1px solid var(--border);border-radius:8px;padding:10px;height:320px}
    .metrics-chart canvas{max-height:300px}
    .metrics-summary{margin-top:10px;font-size:12px;color:var(--text-muted)}
    .metrics-summary table{font-size:12px}
    .metrics-summary th,.metrics-summary td{padding:4px 10px}
    .metrics-summary th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
    .metrics-summary th.sortable:hover{color:var(--text)}
    .metrics-summary th.sortable .arrow{display:inline-block;margin-left:4px;opacity:.35;font-size:10px;width:8px}
    .metrics-summary th.sortable.sort-asc .arrow,
    .metrics-summary th.sortable.sort-desc .arrow{opacity:1;color:var(--accent)}
    .metrics-filter{display:flex;gap:8px;align-items:center;margin:6px 0 8px;flex-wrap:wrap}
    .metrics-filter input{flex:1;min-width:180px;background:#050505;border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text);font-family:inherit;font-size:12px;outline:none}
    .metrics-filter input:focus{border-color:var(--accent)}
    .metrics-filter .count{color:var(--text-muted);font-size:11px;white-space:nowrap}
    .metrics-filter .clear-btn{background:var(--card);border:1px solid var(--border);color:var(--text-muted);border-radius:6px;padding:5px 10px;font-size:11px;cursor:pointer;font-family:inherit}
    .metrics-filter .clear-btn:hover{color:var(--text);background:var(--card-hover)}
    @media (max-width: 800px){ .account{grid-template-columns:1fr} .lists{grid-template-columns:1fr} }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
</head>
<body>
<header>
  <div>
    <h1 id="title">Loading...</h1>
    <div class="meta" id="meta"></div>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <span class="badge" id="sync-badge">syncing</span>
    <a class="badge" href="/ui/">← agents</a>
  </div>
</header>
<main>
  <div class="description" id="description"></div>
  <div id="account-panel" style="display:none"></div>
  <div id="sources"></div>
  <div class="footer">
    Auto-refreshes from the server every sync interval. Raw JSON: <a id="raw-link" href="">data.json</a>
  </div>
</main>
<script>
  function escapeHtml(s){const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML}
  function fmtTime(s){if(!s)return '';try{return new Date(s).toLocaleString()}catch(e){return s}}

  // Render text that may contain Slack-style mrkdwn (*bold*, `code`, <url|label>,
  // :emoji:, <br>) into safe HTML.
  function renderRich(text){
    let s = escapeHtml(text);
    // Slack links: <http://url|label> or <http://url>
    s = s.replace(/&lt;(https?:\/\/[^|&\s]+)\|([^&]+?)&gt;/g, '<a href="$1" target="_blank" rel="noopener">$2</a>');
    s = s.replace(/&lt;(https?:\/\/[^&\s]+)&gt;/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    // Literal <br> from upstream (e.g. Chorus summaries)
    s = s.replace(/&lt;br\s*\/?&gt;/gi, '<br>');
    // Bold: *text* (Slack) and **text** (markdown)
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<strong>$2</strong>');
    // Inline code
    s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    // Known emoji shortcodes -> unicode
    const emoji = {
      ':white_check_mark:':'\u2705', ':rotating_light:':'\u{1F6A8}',
      ':grey_question:':'\u2754', ':warning:':'\u26A0\uFE0F',
      ':x:':'\u274C', ':heavy_check_mark:':'\u2714\uFE0F',
    };
    s = s.replace(/:[a-z0-9_+-]+:/gi, m => emoji[m] || m);
    return s;
  }

  // Turn bare URLs in a plain-text string into clickable <a> tags. Input must
  // already be HTML-escaped.
  function linkify(escaped){
    return escaped.replace(/(https?:\/\/[^\s<>"')]+)(?=[)\].,;:!?]*(\s|$))/g,
      '<a href="$1" target="_blank" rel="noopener">$1<\/a>');
  }

  function renderCell(v){
    if (v === null || v === undefined) return '';
    if (typeof v === 'string') {
      const trimmed = v.length > 400 ? v.slice(0,400)+'…' : v;
      return linkify(escapeHtml(trimmed));
    }
    if (typeof v !== 'object') return escapeHtml(String(v));
    if (Array.isArray(v)) {
      if (v.length === 0) return '<span class="empty">[]</span>';
      // Array of primitives → comma list
      if (v.every(x => x === null || typeof x !== 'object')) {
        const joined = v.map(x => String(x ?? '')).join(', ');
        return escapeHtml(joined.length > 240 ? joined.slice(0,240)+'…' : joined);
      }
      return '<details class="cell"><summary>['+v.length+' items]</summary><pre>'+escapeHtml(JSON.stringify(v,null,2))+'</pre></details>';
    }
    const keys = Object.keys(v);
    if (keys.length === 0) return '<span class="empty">{}</span>';
    return '<details class="cell"><summary>{'+keys.length+' keys}</summary><pre>'+escapeHtml(JSON.stringify(v,null,2))+'</pre></details>';
  }

  function renderContent(content){
    if (content === null || content === undefined) return '<div class="empty">No data.</div>';
    // Structured Datadog metrics payload → Chart.js line chart per site.
    if (content && typeof content === 'object' && !Array.isArray(content) && content.kind === 'datadog_metrics') {
      return renderMetricsPayload(content);
    }
    if (typeof content === 'string') {
      // Heuristic: if the text contains Slack markup, render rich; otherwise plain pre.
      if (/[*<`:]/.test(content)) {
        return '<div class="rich">' + renderRich(content) + '</div>';
      }
      return '<pre class="content">' + escapeHtml(content) + '</pre>';
    }
    if (Array.isArray(content)) {
      if (content.length === 0) return '<div class="empty">No results.</div>';
      const first = content[0];
      if (first && typeof first === 'object' && !Array.isArray(first)) {
        const keys = Array.from(content.reduce((s,r)=>{Object.keys(r||{}).forEach(k=>s.add(k));return s}, new Set())).slice(0, 10);
        const rows = content.slice(0, 100).map(r => '<tr>' + keys.map(k => '<td>' + renderCell(r[k]) + '</td>').join('') + '</tr>').join('');
        return '<div class="table-wrap"><table><thead><tr>' + keys.map(k=>'<th>'+escapeHtml(k)+'</th>').join('') + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
          + (content.length > 100 ? '<div class="empty">Showing 100 of ' + content.length + ' rows.</div>' : '');
      }
      return '<pre class="content">' + escapeHtml(JSON.stringify(content, null, 2)) + '</pre>';
    }
    if (typeof content === 'object') {
      return '<pre class="content">' + escapeHtml(JSON.stringify(content, null, 2)) + '</pre>';
    }
    return '<pre class="content">' + escapeHtml(String(content)) + '</pre>';
  }

  let signalChart = null;
  // Chart.js instances keyed by canvas DOM id so we can destroy them on re-render.
  const metricsCharts = {};
  let metricsChartSeq = 0;

  // Deterministic-ish color from string hash, for series lines.
  function colorForScope(scope, i){
    const palette = [
      '#4a8ad4', '#57c97a', '#e7cb5e', '#eda760', '#e07c7c', '#b288d9',
      '#55b8c5', '#c58dbf', '#8bc56d', '#d68888', '#6d9fd6', '#c5a86d',
    ];
    if (!scope) return palette[i % palette.length];
    let h = 0;
    for (let k = 0; k < scope.length; k++) h = (h * 31 + scope.charCodeAt(k)) | 0;
    return palette[Math.abs(h) % palette.length];
  }

  function fmtMetricNum(v){
    if (v === null || v === undefined || Number.isNaN(v)) return '—';
    const a = Math.abs(v);
    if (a === 0) return '0';
    if (a >= 1e12) return (v/1e12).toFixed(2) + 'T';
    if (a >= 1e9)  return (v/1e9).toFixed(2) + 'G';
    if (a >= 1e6)  return (v/1e6).toFixed(2) + 'M';
    if (a >= 1e3)  return (v/1e3).toFixed(2) + 'K';
    if (a >= 10) return v.toFixed(2);
    if (a >= 1) return v.toFixed(3);
    return v.toFixed(4);
  }

  // Infer a display unit for a datadog_query_metrics site so we can render
  // meaningful values (cores / millicores / %, MiB / GiB, etc.) instead of
  // raw nanocores or bytes. Falls back to "raw" SI formatting when the query
  // shape is unfamiliar.
  function inferMetricUnit(site){
    const q = String(site.query || '').toLowerCase();
    let maxAbs = 0;
    for (const s of (site.series || [])) {
      for (const k of ['avg','min','max','last']) {
        const v = s[k];
        if (typeof v === 'number' && Number.isFinite(v)) {
          const a = Math.abs(v);
          if (a > maxAbs) maxAbs = a;
        }
      }
    }
    const isCPU = /kubernetes\.cpu\./.test(q);
    const isMem = /kubernetes\.memory\./.test(q);
    // CPU usage.total is reported in nanocores (1 core = 1e9), while
    // requests/limits/capacity/allocatable are reported in cores directly.
    // Without this split, a 0.25-core request renders as "0.000m".
    const isCPUCoresNative = isCPU && /\.(requests|limits|capacity|allocatable)\b/.test(q);
    const endsMul100 = /\*\s*100\s*$/.test(q.trim());
    let kind = 'raw';
    let warning = '';
    if (isCPU && endsMul100 && maxAbs <= 1000) {
      kind = 'percent';
    } else if (isCPU && endsMul100 && maxAbs > 1000) {
      kind = 'cores';
      warning = "Query ends with '* 100' (intended as % of CPU requests), but the values are nanocore-sized. This usually means kubernetes.cpu.requests is missing or zero for these workloads, so the division degenerated into the raw usage numerator. Showing CPU usage in cores instead of percent.";
    } else if (isCPUCoresNative) {
      kind = 'cores_native';
    } else if (isCPU) {
      kind = 'cores';
    } else if (isMem) {
      kind = 'bytes';
    } else if (endsMul100 && maxAbs <= 1000) {
      kind = 'percent';
    }
    return { kind, warning, maxAbs };
  }

  function unitDisplayLabel(u){
    switch (u.kind) {
      case 'percent':       return '%';
      case 'cores':         return 'CPU cores';
      case 'cores_native':  return 'CPU cores';
      case 'bytes':         return 'bytes (auto-scaled)';
      default:              return 'native units';
    }
  }

  function formatByUnit(v, u){
    if (v === null || v === undefined || Number.isNaN(v) || !Number.isFinite(v)) return '—';
    if (u.kind === 'percent') {
      return (Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(2)) + '%';
    }
    if (u.kind === 'cores') {
      // incoming values are nanocores (1 core = 1e9 nanocores)
      const cores = v / 1e9;
      const a = Math.abs(cores);
      if (a === 0) return '0';
      if (a >= 1)     return cores.toFixed(2) + ' cores';
      if (a >= 0.001) return (cores * 1000).toFixed(0) + 'm';
      return (cores * 1000).toFixed(3) + 'm';
    }
    if (u.kind === 'cores_native') {
      // incoming values are already in cores (requests/limits)
      const cores = v;
      const a = Math.abs(cores);
      if (a === 0) return '0';
      if (a >= 1)     return cores.toFixed(2) + ' cores';
      if (a >= 0.001) return (cores * 1000).toFixed(0) + 'm';
      return (cores * 1000).toFixed(3) + 'm';
    }
    if (u.kind === 'bytes') {
      const a = Math.abs(v);
      if (a >= 1024 ** 4) return (v / 1024 ** 4).toFixed(2) + ' TiB';
      if (a >= 1024 ** 3) return (v / 1024 ** 3).toFixed(2) + ' GiB';
      if (a >= 1024 ** 2) return (v / 1024 ** 2).toFixed(2) + ' MiB';
      if (a >= 1024)      return (v / 1024).toFixed(2) + ' KiB';
      return v.toFixed(0) + ' B';
    }
    return fmtMetricNum(v);
  }

  function chartScale(u){
    if (u.kind === 'cores') return { div: 1e9, label: 'cores' };
    if (u.kind === 'cores_native') return { div: 1, label: 'cores' };
    if (u.kind === 'bytes') {
      const a = u.maxAbs || 0;
      if (a >= 1024 ** 3) return { div: 1024 ** 3, label: 'GiB' };
      if (a >= 1024 ** 2) return { div: 1024 ** 2, label: 'MiB' };
      if (a >= 1024)      return { div: 1024,      label: 'KiB' };
      return { div: 1, label: 'bytes' };
    }
    if (u.kind === 'percent') return { div: 1, label: '%' };
    return { div: 1, label: '' };
  }

  function describeWindow(fromMs, toMs){
    if (!fromMs || !toMs) return '';
    const ms = Math.max(0, toMs - fromMs);
    const mins = ms / 60000;
    if (mins < 90)  return Math.round(mins) + ' min';
    const hrs = ms / 3600000;
    if (hrs < 48)   return (hrs % 1 === 0 ? hrs.toFixed(0) : hrs.toFixed(1)) + ' h';
    return (hrs / 24).toFixed(1) + ' d';
  }

  // Render a short "what are we looking at" banner above each chart:
  // series count, window, top/bottom scope by avg, plus any unit warning.
  function metricsSummaryIntro(site, u){
    const series = site.series || [];
    if (series.length === 0) return '';
    const sorted = [...series]
      .filter(s => typeof s.avg === 'number' && Number.isFinite(s.avg))
      .sort((a, b) => b.avg - a.avg);
    const top = sorted[0];
    const bot = sorted[sorted.length - 1];
    const win = describeWindow(site.from_date, site.to_date);
    const bits = [];
    bits.push('<strong>' + series.length + '</strong> series' + (win ? ' over the last <strong>' + win + '</strong>' : ''));
    if (top) bits.push('highest avg: <strong>' + escapeHtml(top.scope || '*') + '</strong> (' + formatByUnit(top.avg, u) + ')');
    if (bot && bot !== top) bits.push('lowest avg: <strong>' + escapeHtml(bot.scope || '*') + '</strong> (' + formatByUnit(bot.avg, u) + ')');
    if (site.truncated) bits.push('+' + site.truncated + ' more hidden');
    const intro = '<div class="metrics-summary-intro empty" style="margin:6px 0 8px">Showing ' + bits.join(' · ') + '. Values formatted as ' + unitDisplayLabel(u) + '.</div>';
    const warn = u.warning
      ? '<div class="source-error" style="background:#3a2a10;border-color:#d79a4a;color:#f3d8a8;margin:6px 0 8px">⚠ ' + escapeHtml(u.warning) + '</div>'
      : '';
    return warn + intro;
  }

  // Build a URL that opens the Datadog Metrics Explorer on the right site with
  // the query's time window pre-set. Datadog's explorer encodes the actual
  // query expression in an opaque hash fragment, so the query cannot be
  // pre-filled via URL params — we pair this link with a "Copy query" button.
  function datadogExploreURL(site, fromMs, toMs){
    const host = site && site.indexOf('.') !== -1 ? site : 'datadoghq.com';
    const params = new URLSearchParams({ paused: 'true' });
    if (fromMs) params.set('start', String(fromMs));
    if (toMs) params.set('end', String(toMs));
    return 'https://app.' + host + '/metric/explorer?' + params.toString();
  }

  function copyToClipboard(text, btn){
    const done = () => {
      if (!btn) return;
      const prev = btn.textContent;
      btn.textContent = 'Copied';
      setTimeout(() => { btn.textContent = prev; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, done);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta); done();
    }
  }
  window.__copyMetricsQuery = function(btn){
    const q = btn && btn.getAttribute('data-query');
    if (q) copyToClipboard(q, btn);
  };
  // Auto-copy the query when opening Datadog so the user just pastes it into
  // the explorer's query box. Datadog does not accept arbitrary query
  // expressions via URL (the state is in an opaque LZString hash fragment),
  // so copy+paste is the only reliable path.
  window.__openInDatadog = function(link){
    const q = link && link.getAttribute('data-query');
    if (q) copyToClipboard(q, null);
    return true; // let the anchor navigate
  };

  // Interactive sort + filter helpers for the per-site metrics summary table.
  // Each row carries the raw (pre-formatted) numeric values on data-* attrs so
  // we sort numerically (e.g. 1.2G vs 950M) rather than by display string.
  function __metricsApplyFilter(table){
    const input = document.querySelector('input[data-table="' + table.id + '"]');
    const q = (input ? input.value : '').trim().toLowerCase();
    let shown = 0, total = 0;
    table.querySelectorAll('tbody tr').forEach(tr => {
      total++;
      const scope = tr.getAttribute('data-scope') || '';
      const hit = !q || scope.indexOf(q) !== -1;
      tr.style.display = hit ? '' : 'none';
      if (hit) shown++;
    });
    const countEl = document.getElementById(table.id + '-count');
    if (countEl) countEl.textContent = q ? (shown + ' / ' + total + ' series') : (total + ' series');
  }
  function __metricsApplySort(table){
    const key = table.getAttribute('data-sort-key') || 'avg';
    const dir = (table.getAttribute('data-sort-dir') || 'desc') === 'asc' ? 1 : -1;
    // Determine numeric vs string from the header definition.
    const th = table.querySelector('thead th[data-key="' + key + '"]');
    const numeric = th && th.getAttribute('data-num') === '1';
    const tbody = table.querySelector('tbody');
    const rows = Array.from(tbody.querySelectorAll('tr'));
    rows.sort((a, b) => {
      const av = a.getAttribute('data-' + key) || '';
      const bv = b.getAttribute('data-' + key) || '';
      if (numeric) {
        const an = av === '' ? -Infinity : parseFloat(av);
        const bn = bv === '' ? -Infinity : parseFloat(bv);
        if (an === bn) return 0;
        return an < bn ? -1 * dir : 1 * dir;
      }
      return av.localeCompare(bv) * dir;
    });
    const frag = document.createDocumentFragment();
    rows.forEach(r => frag.appendChild(r));
    tbody.appendChild(frag);
    // Reflect state in header arrows.
    table.querySelectorAll('thead th.sortable').forEach(h => {
      h.classList.remove('sort-asc','sort-desc');
      const arrow = h.querySelector('.arrow');
      if (arrow) arrow.textContent = '';
    });
    if (th) {
      th.classList.add(dir === 1 ? 'sort-asc' : 'sort-desc');
      const arrow = th.querySelector('.arrow');
      if (arrow) arrow.textContent = dir === 1 ? '▲' : '▼';
    }
  }
  window.__sortMetricsTable = function(th){
    const table = th.closest('table');
    if (!table) return;
    const key = th.getAttribute('data-key');
    const curKey = table.getAttribute('data-sort-key');
    const curDir = table.getAttribute('data-sort-dir') || 'desc';
    let dir;
    if (curKey === key) {
      dir = curDir === 'asc' ? 'desc' : 'asc';
    } else {
      // New column: numeric columns default to desc (biggest first), scope to asc.
      dir = th.getAttribute('data-num') === '1' ? 'desc' : 'asc';
    }
    table.setAttribute('data-sort-key', key);
    table.setAttribute('data-sort-dir', dir);
    __metricsApplySort(table);
  };
  window.__filterMetricsTable = function(input){
    const id = input.getAttribute('data-table');
    const table = document.getElementById(id);
    if (table) __metricsApplyFilter(table);
  };
  window.__clearMetricsFilter = function(btn){
    const id = btn.getAttribute('data-table');
    const input = document.querySelector('input[data-table="' + id + '"]');
    if (input) { input.value = ''; input.dispatchEvent(new Event('input')); input.focus(); }
  };
  // Initialize sort indicators + counts for all metrics tables on the page
  // after the dashboard finishes rendering each tick.
  function __initMetricsTables(){
    document.querySelectorAll('table[id^="metrics-chart-"]').forEach(table => {
      __metricsApplySort(table);
      __metricsApplyFilter(table);
    });
  }

  // Render a datadog_query_metrics source payload: per-site chart + summary table.
  function renderMetricsPayload(payload){
    const sites = payload.sites || [];
    if (sites.length === 0) return '<div class="empty">No metric series returned.</div>';
    // Pair each site with the canvas id used in its HTML so the async wiring
    // below can find exactly the right element (the global seq counter keeps
    // ticking while other source cards in the same dashboard render).
    const canvasIds = sites.map(() => 'metrics-chart-' + (++metricsChartSeq));
    const blocks = sites.map((site, siteIdx) => {
      const canvasId = canvasIds[siteIdx];
      const series = site.series || [];
      const unit = inferMetricUnit(site);
      const unitLabel = site.unit ? escapeHtml(site.unit) : escapeHtml(unitDisplayLabel(unit));
      const unitBadge = ' (' + unitLabel + ')';
      const errorBlock = site.error ? '<div class="source-error">' + escapeHtml(site.error) + '</div>' : '';
      const ddURL = datadogExploreURL(site.site, site.from_date, site.to_date);
      const qAttr = escapeHtml(site.query || '');
      const header =
        '<h4>[' + escapeHtml(site.label || site.site || '') + ']' + unitBadge +
        ' <span class="q" title="' + qAttr + '">' + qAttr + '</span>' +
        ' <button type="button" class="dd-link" data-query="' + qAttr + '" onclick="__copyMetricsQuery(this)">Copy query</button>' +
        ' <a href="' + ddURL + '" target="_blank" rel="noopener" class="dd-link" data-query="' + qAttr + '" onclick="__openInDatadog(this)" title="Copies the query to your clipboard, then opens Datadog Metrics Explorer. Paste into the query box.">Copy &amp; Open in Datadog \u2197</a>' +
        '</h4>';
      if (errorBlock && series.length === 0) {
        return '<div class="metrics-site">' + header + errorBlock + '</div>';
      }
      if (series.length === 0) {
        return '<div class="metrics-site">' + header +
          '<div class="empty" style="margin-top:8px">No data returned. The metric name may not exist in this Datadog site, the tag filter may match zero series, or the time window may be empty. Try the <strong>Open in Datadog</strong> link above to verify the query, then adjust the metric or tags.</div>' +
          '</div>';
      }
      const intro = metricsSummaryIntro(site, unit);
      let summaryRows = '';
      const tableId = canvasId + '-table';
      if (series.length > 0) {
        const legend =
          '<div class="empty" style="margin:4px 0 8px">' +
          'Each row is one tag group. Values are in <strong>' + unitLabel + '</strong>. ' +
          '<strong>avg / min / max / last</strong> are computed across the ' +
          'query window (<strong>n</strong> = sample count). ' +
          'Click any column header to sort; use the filter box to narrow by scope. ' +
          'The chart above plots the same series over time.' +
          '</div>';
        const filter =
          '<div class="metrics-filter">' +
            '<input type="text" placeholder="Filter scope…" data-table="' + tableId + '" oninput="__filterMetricsTable(this)" />' +
            '<button type="button" class="clear-btn" data-table="' + tableId + '" onclick="__clearMetricsFilter(this)">Clear</button>' +
            '<span class="count" id="' + tableId + '-count"></span>' +
          '</div>';
        const cols = [
          { key:'scope', label:'scope', num:false, title:'Tag combination for this series' },
          { key:'avg',   label:'avg',   num:true,  title:'Mean value across the window' },
          { key:'min',   label:'min',   num:true,  title:'Minimum value in the window' },
          { key:'max',   label:'max',   num:true,  title:'Maximum value in the window' },
          { key:'last',  label:'last',  num:true,  title:'Most recent data point' },
          { key:'count', label:'n',     num:true,  title:'Number of non-null samples' },
        ];
        const head = cols.map(c =>
          '<th class="sortable" data-key="' + c.key + '" data-num="' + (c.num ? '1' : '0') + '"' +
          ' title="' + c.title + ' (click to sort)" onclick="__sortMetricsTable(this)">' +
          c.label + '<span class="arrow"></span></th>'
        ).join('');
        const body = series.map(s => '<tr' +
            ' data-scope="' + escapeHtml((s.scope || '*').toLowerCase()) + '"' +
            ' data-avg="'   + (Number.isFinite(s.avg)   ? s.avg   : '') + '"' +
            ' data-min="'   + (Number.isFinite(s.min)   ? s.min   : '') + '"' +
            ' data-max="'   + (Number.isFinite(s.max)   ? s.max   : '') + '"' +
            ' data-last="'  + (Number.isFinite(s.last)  ? s.last  : '') + '"' +
            ' data-count="' + (s.count ?? 0) + '"' +
          '>' +
            '<td>' + escapeHtml(s.scope || '*') + '</td>' +
            '<td>' + formatByUnit(s.avg, unit) + '</td>' +
            '<td>' + formatByUnit(s.min, unit) + '</td>' +
            '<td>' + formatByUnit(s.max, unit) + '</td>' +
            '<td>' + formatByUnit(s.last, unit) + '</td>' +
            '<td>' + (s.count ?? 0) + '</td>' +
          '</tr>').join('');
        summaryRows = '<div class="metrics-summary">' + legend + filter +
          '<div class="table-wrap"><table id="' + tableId + '" data-sort-key="avg" data-sort-dir="desc">' +
            '<thead><tr>' + head + '</tr></thead>' +
            '<tbody>' + body + '</tbody>' +
          '</table></div>' +
          (site.truncated ? '<div class="empty" style="margin-top:6px">… and ' + site.truncated + ' more series (increase top_n to see more)</div>' : '') +
          '</div>';
      }
      return '<div class="metrics-site">' +
        header +
        errorBlock +
        intro +
        '<div class="metrics-chart"><canvas id="' + canvasId + '"></canvas></div>' +
        summaryRows +
        '</div>';
    }).join('');

    // Defer Chart.js wiring until the new markup is attached to the DOM.
    // requestAnimationFrame ensures layout has committed so the canvas has a
    // non-zero size; a bare setTimeout(...,0) could fire before the browser
    // has realized the newly-inserted `.metrics-chart` container.
    const wire = () => {
      sites.forEach((site, idx) => {
        const canvasId = canvasIds[idx];
        const canvas = document.getElementById(canvasId);
        if (!canvas) {
          console.warn('[metrics] canvas missing for', canvasId);
          return;
        }
        if (typeof Chart === 'undefined') {
          console.warn('[metrics] Chart.js not loaded; skipping', canvasId);
          return;
        }
        if (metricsCharts[canvasId]) { metricsCharts[canvasId].destroy(); }
        const unit = inferMetricUnit(site);
        const scale = chartScale(unit);
        const datasets = (site.series || []).map((s, i) => ({
          label: s.scope || '*',
          data: (s.points || []).map(p => ({ x: p[0], y: (scale.div === 1 ? p[1] : p[1] / scale.div) })),
          borderColor: colorForScope(s.scope || String(i), i),
          backgroundColor: colorForScope(s.scope || String(i), i) + '33',
          borderWidth: 1.5,
          pointRadius: 0,
          pointHoverRadius: 3,
          tension: 0.25,
          spanGaps: true,
        }));
        try {
          metricsCharts[canvasId] = new Chart(canvas.getContext('2d'), {
          type: 'line',
          data: { datasets },
          options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'nearest', intersect: false },
            plugins: {
              legend: {
                display: datasets.length <= 12,
                labels: { color: '#b0b8c1', boxWidth: 10, font: { size: 10 } },
                position: 'bottom',
              },
              tooltip: {
                callbacks: {
                  title: items => items.length ? new Date(items[0].parsed.x).toLocaleString() : '',
                  label: item => (item.dataset.label || '') + ': ' + formatByUnit(item.parsed.y * scale.div, unit),
                },
              },
            },
            scales: {
              x: {
                type: 'time',
                time: { tooltipFormat: 'MMM d, HH:mm' },
                ticks: { color: '#b0b8c1', maxRotation: 0, autoSkipPadding: 20 },
                grid: { color: 'rgba(255,255,255,0.04)' },
              },
              y: {
                ticks: { color: '#b0b8c1' },
                grid: { color: 'rgba(255,255,255,0.04)' },
                beginAtZero: true,
                title: scale.label
                  ? { display: true, text: scale.label, color: '#b0b8c1' }
                  : { display: false },
              },
            },
          },
          });
        } catch (err) {
          console.error('[metrics] Chart.js init failed for ' + canvasId, err);
        }
      });
    };
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(() => requestAnimationFrame(wire));
    } else {
      setTimeout(wire, 0);
    }
    return blocks;
  }

  function renderAccount(panel, acct){
    const band = (acct.band || 'yellow').toLowerCase();
    const risks = (acct.risks || []).map(r => '<li>' + escapeHtml(r) + '</li>').join('') || '<li class="empty">No top risks.</li>';
    const actions = (acct.actions || []).map(r => '<li>' + escapeHtml(r) + '</li>').join('') || '<li class="empty">No immediate actions.</li>';
    panel.innerHTML =
      '<div class="account">' +
        '<div class="score-box band-' + escapeHtml(band) + '">' +
          '<div class="num">' + (acct.score ?? 0) + '</div>' +
          '<div class="band band-' + escapeHtml(band) + '">' + escapeHtml(band) + '</div>' +
          '<div class="source-meta" style="margin-top:10px">' + escapeHtml(acct.account_name || '') + '</div>' +
        '</div>' +
        '<div class="lists">' +
          '<div class="list-block"><h3>Top risks</h3><ul>' + risks + '</ul></div>' +
          '<div class="list-block"><h3>Action items</h3><ul>' + actions + '</ul></div>' +
        '</div>' +
        '<div class="signal-chart"><canvas id="signal-chart"></canvas></div>' +
      '</div>';
    // Signal breakdown bar chart.
    const signals = acct.signals || [];
    const labels = signals.map(s => s.name);
    const scored = signals.map(s => s.score);
    const weights = signals.map(s => s.weight);
    const ctx = panel.querySelector('#signal-chart').getContext('2d');
    if (signalChart) signalChart.destroy();
    // Chart.js global loaded via CDN; bail gracefully if the CDN is blocked.
    if (typeof Chart === 'undefined') return;
    signalChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [
          { label: 'Score', data: scored, backgroundColor: '#4a8ad4' },
          { label: 'Weight (max)', data: weights, backgroundColor: 'rgba(74,138,212,0.18)' },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#b0b8c1' } } },
        scales: {
          x: { ticks: { color: '#b0b8c1' }, grid: { color: 'rgba(255,255,255,0.04)' } },
          y: { ticks: { color: '#b0b8c1' }, grid: { color: 'rgba(255,255,255,0.04)' }, beginAtZero: true },
        },
      },
    });
  }

  async function load(){
    const path = window.location.pathname.replace(/\/$/, '');
    const dataURL = path + '/data.json';
    document.getElementById('raw-link').href = dataURL;
    try {
      const r = await fetch(dataURL, { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      document.title = d.name + ' — arbetern';
      document.getElementById('title').textContent = d.name;
      document.getElementById('meta').textContent =
        'agent: ' + d.agent + '  ·  every ' + d.sync_interval +
        '  ·  last sync: ' + (d.last_sync ? fmtTime(d.last_sync) : 'pending');
      document.getElementById('description').textContent = d.description || '';
      const badge = document.getElementById('sync-badge');
      if (d.last_error) { badge.textContent = 'error'; badge.className = 'badge err'; }
      else if (d.last_sync) { badge.textContent = 'live'; badge.className = 'badge ok'; }

      // Account-health summary panel (only for Kind="account").
      const acctPanel = document.getElementById('account-panel');
      if (d.kind === 'account' && d.account) {
        acctPanel.style.display = 'block';
        renderAccount(acctPanel, d.account);
      } else {
        acctPanel.style.display = 'none';
      }

      const sources = document.getElementById('sources');
      sources.innerHTML = '';
      (d.sources || []).forEach((s, i) => {
        const label = s.name || (s.type + '_' + i);
        const res = (d.data || {})[label] || {};
        const card = document.createElement('div');
        card.className = 'source';
        const header = '<div class="source-header"><div><div class="source-title">' + escapeHtml(label) +
          ' <span class="source-type">' + escapeHtml(s.type) + '</span></div></div>' +
          '<div class="source-meta">' + (res.fetched_at ? fmtTime(res.fetched_at) : 'pending') +
          (res.duration_ms != null ? ' · ' + res.duration_ms + 'ms' : '') + '</div></div>';
        const body = res.error
          ? '<div class="source-error">' + escapeHtml(res.error) + '</div>'
          : renderContent(res.content);
        card.innerHTML = header + body;
        sources.appendChild(card);
      });
    } catch (err) {
      document.getElementById('title').textContent = 'Failed to load';
      document.getElementById('meta').textContent = String(err);
      document.getElementById('sync-badge').textContent = 'error';
      document.getElementById('sync-badge').className = 'badge err';
    }
  }

  load();
  // Poll once every 15s so users see refreshed data without reloading.
  setInterval(load, 15000);
</script>
</body>
</html>

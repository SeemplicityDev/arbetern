replicaCount: 1

image:
  repository: ghcr.io/justmike1/arbetern
  pullPolicy: Always
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  # distroless/static:nonroot runs as uid/gid 65532. fsGroup ensures the shared
  # data volume (emptyDir / PVC for dashboards + workflows) is writable by that user.
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext: {}

containerPort: 8080

env:
  PORT: "8080"
  GENERAL_MODEL: "openai/gpt-4o" # options: openai/gpt-4o, meta/llama-3.1-405b-instruct, etc.
  # CODE_MODEL: "openai/gpt-4o"  # Separate model for code-generation tasks (PRs, file edits). Defaults to GENERAL_MODEL.
  APP_URL: ""  # Public base URL of this app (e.g. "https://ai.dev.example.io"). Used for UI link in Jira stamps.
  # UI_ALLOWED_CIDRS: "10.0.0.0/8,203.0.113.10/32"  # Comma-separated CIDRs; empty = no restriction.
  # THREAD_SESSION_TTL: "3m"  # How long a thread session stays active (Go duration: 3m, 5m30s, etc.)
  # CHAT_RETENTION: "168h"  # How long an idle UI chat conversation is kept before auto-deletion (Go duration). Default 168h (1 week).
  # MAX_TOOL_ROUNDS: "200"  # Max LLM tool-call rounds per request. Default 200; raise for very long multi-step workflows.
  # AWS_REGION: "us-east-1"   # Region used to sign Cost Explorer SigV4 calls. CE is global; leave as us-east-1 unless you have a reason not to.
  # AZURE_AUTHORITY_HOST: "https://login.microsoftonline.com"   # Override only for sovereign clouds (Azure Government, China).
  # AZURE_MANAGEMENT_HOST: "https://management.azure.com"       # Override only for sovereign clouds.

# Persistent data directory shared by dashboards + workflows JSON snapshots.
# Both features store their files under `persistence.mountPath/<subdir>/<agent>/...`.
# When `persistentVolumeClaim.enabled` is true, a PVC is provisioned per replica
# so the data survives pod restarts. Otherwise an emptyDir is used and the data
# is rebuilt from scratch on every roll (fine for dev).
persistence:
  enabled: true
  mountPath: /var/lib/arbetern
  persistentVolumeClaim:
    enabled: false
    size: 2Gi
    # storageClass: ""           # Leave empty for cluster default
    accessModes:
      - ReadWriteOnce
    annotations: {}

# Feature toggles — DASHBOARDS_DIR / WORKFLOWS_DIR are derived from
# persistence.mountPath + each feature's subPath. Disable a feature by
# setting enabled: false (its env var is then omitted).
dashboards:
  enabled: true
  subPath: dashboards
  # GitOps sync: same model as workflows below, but for dashboards.
  # Layout in the remote repo (basePath defaults to "arbetern/dashboards"):
  #   arbetern/dashboards/<agent>/<id>.json
  gitops:
    enabled: false
    # owner: ""
    repo: "<your-dashboards-repo>"
    # branch: ""
    basePath: "arbetern/dashboards"
    interval: "5m"
    prune: true

workflows:
  enabled: true
  subPath: workflows
  # GitOps sync: poll a remote GitHub repo for workflow JSON descriptors and
  # reconcile them into the local registry every `interval`. The same
  # GITHUB_TOKEN the rest of the app uses is required. Workflows synced
  # this way are tagged Source="gitops" so the UI can mark them read-only
  # (toggling enabled still works locally; everything else is overwritten
  # on the next tick to keep git as the source of truth).
  #
  # Layout in the remote repo (basePath defaults to "arbetern/workflows"):
  #   arbetern/workflows/
  #     <agent>/
  #       <id>.json    # one descriptor per file; see docs/WORKFLOWS_GITOPS.md
  gitops:
    enabled: false
    # owner: ""                # optional; defaults to bot's resolved owner
    repo: "<your-workflows-repo>"  # required when enabled
    # branch: ""               # empty == repo default branch
    basePath: "arbetern/workflows"
    interval: "5m"             # Go duration; minimum 30s
    prune: true                # delete locally-managed workflows that disappear from git

# Per-user rolling context store. Files at <mountPath>/<subPath>/<agent>/<user>/context.txt
# accumulate compact (question, summary) turns so the agent can recognise
# recurring user topics across DMs and channels. Disable to fall back to
# an in-tmp directory that does not survive pod restarts.
userContext:
  enabled: true
  subPath: user-context

# Centralized per-agent chat transcripts. Files at <mountPath>/<subPath>/<agent>/history.json
# hold a single shared conversation per agent (no per-user auth yet, so every
# viewer sees the same history). This only controls where transcripts are
# persisted; chat itself is enabled per agent via `chat_enabled: true` in each
# agent's config.yaml. Disable to fall back to an in-tmp directory that does
# not survive pod restarts.
chat:
  enabled: true
  subPath: chat

secretName: arbetern-secrets

# Set to true to have the chart create the Secret resource.
# If false, create the secret externally before installing:
#   kubectl create secret generic arbetern-secrets \
#     --from-literal=slack-bot-token=xoxb-... \
#     --from-literal=slack-signing-secret=... \
#     --from-literal=github-token=ghp_... \
#     --from-literal=slack-app-token=xapp-...  # optional, for Socket Mode
createSecret: false

secretValues:
  slack-bot-token: "xoxb-EXAMPLE-TOKEN"
  slack-signing-secret: "EXAMPLE-SIGNING-SECRET"
  github-token: "ghp_EXAMPLE-GITHUB-TOKEN"
  # Azure OpenAI credentials (optional – when set the app uses Azure instead of GitHub Models)
  azure-openai-endpoint: ""
  azure-api-key: ""
  # Atlassian integration (optional — enables Jira tickets + Confluence page reading)
  atlassian-url: ""           # e.g. "https://yourorg.atlassian.net"
  atlassian-email: ""         # Atlassian account email (Basic Auth)
  atlassian-api-token: ""     # Atlassian API token (Basic Auth)
  jira-project: ""            # Default Jira project key (e.g. "ENG")
  # Slack Socket Mode (optional – enables thread follow-ups without slash commands)
  slack-app-token: ""    # App-level token (xapp-...) with connections:write scope
  # NVD CVE API (optional — enables real-time CVE lookups for the security agent)
  nvd-api-key: ""        # Get one at https://nvd.nist.gov/developers/request-an-api-key
  # Salesforce (optional — enables SOQL queries for the CS agent)
  sf-consumer-key: ""    # Salesforce Connected App consumer key
  sf-consumer-secret: "" # Salesforce Connected App consumer secret
  # sf-login-url: ""     # Defaults to https://login.salesforce.com. Use https://test.salesforce.com for sandboxes.
  # Chorus / ZoomInfo (optional — enables call intelligence and deal momentum for CS agent)
  chorus-api-token: ""   # Chorus API token from Personal Settings
  # chorus-base-url: ""  # Defaults to https://chorus.ai
  # Datadog (optional — enables log search, monitor inspection, and infrastructure visibility)
  # Supports dual-site: configure US, EU, or both. Site is inferred from user prompts/URLs.
  # dd-api-key-us: ""   # Datadog US API key (datadoghq.com)
  # dd-app-key-us: ""   # Datadog US Application key
  # dd-api-key-eu: ""   # Datadog EU API key (datadoghq.eu)
  # dd-app-key-eu: ""   # Datadog EU Application key
  # AWS Cost Explorer (optional — enables aws_get_cost_and_usage / aws_get_cost_forecast /
  # aws_list_dimension_values). Preferred auth in-cluster is IRSA: annotate the service
  # account (`serviceAccount.annotations.eks.amazonaws.com/role-arn: ...`) with an IAM
  # role that has `ce:GetCostAndUsage`, `ce:GetCostForecast`, `ce:GetDimensionValues`.
  # The static credentials below are a fallback for non-EKS clusters.
  # aws-access-key-id: ""       # IAM access key ID
  # aws-secret-access-key: ""   # IAM secret access key
  # aws-session-token: ""       # Optional, for STS temporary credentials
  # Azure Cost Management (optional — enables azure_get_cost_and_usage / azure_get_cost_forecast /
  # azure_list_dimension_values). Requires a service principal with EITHER:
  #   - Enterprise Reader on the EA billing account (set azure-billing-account-id below).
  #     Best path for Enterprise Agreement tenants — canonical EA endpoint, tenant-wide.
  #   - Cost Management Reader at the tenant root management group (default — leave
  #     azure-management-group-id empty for tenant-wide). Best path for PAYG / MCA / CSP.
  # Tenant, client, secret are required; pick exactly one of the two scope hints.
  # Sovereign-cloud host overrides go in env.
  # azure-tenant-id: ""               # AAD tenant the service principal lives in
  # azure-client-id: ""               # Service principal application (client) ID
  # azure-client-secret: ""           # Service principal client secret
  # azure-billing-account-id: ""      # EA enrollment number (e.g. 86462187). Wins over MG when set.
  # azure-management-group-id: ""     # Optional MG scope. Leave empty for tenant-wide (root MG = tenant ID)

# Optional OAuth2 authentication proxy (oauth2-proxy subchart). Disabled by
# default; values are passed straight through to the subchart
# (https://github.com/oauth2-proxy/manifests).
#
# When enabled, the arbetern `ingress` below is automatically rewired to
# backend the oauth2-proxy Service, so traffic hits the proxy first and is
# forwarded to arbetern via `upstreams`. Only /ui/ and /api/ are gated; Slack
# webhooks and /healthz stay public via `skip_auth_routes` (Slack can't do an
# OAuth login). RE2 has no negative lookahead, so we allow-list public paths.
oauth2-proxy:
  enabled: false
  config:
    # OAuth credentials (override per env in deploy.local.values.yaml). Map to
    # the keys client-id/client-secret/cookie-secret on "<release>-oauth2-proxy".
    # Generate cookieSecret: openssl rand -base64 32 | tr -- '+/' '-_'
    clientID: ""
    clientSecret: ""
    cookieSecret: ""
    # Or reference a pre-existing Secret instead of the inline values above:
    # existingSecret: ""
    # Legacy oauth2_proxy.cfg format on purpose — it's the chart's stable
    # config source and works with the chart's env-var credential injection.
    # `upstreams` host = arbetern Service name = Helm release name
    # (e.g. release "foo" -> http://foo-arbetern:80); adjust if yours differs.
    configFile: |-
      email_domains = ["*"]
      upstreams = ["http://arbetern:80"]
      # Trust the ALB's X-Forwarded-* headers (TLS is terminated upstream).
      # Required behind an L7 proxy for https callback URLs, the secure cookie,
      # and real client IP in X-Forwarded-For (arbetern's UI_ALLOWED_CIDRS gate).
      reverse_proxy = true
      # Single provider (Google) — skip the interstitial sign-in button page.
      skip_provider_button = true
      # Pass the authenticated identity to the upstream app as
      # X-Auth-Request-Email / X-Auth-Request-Groups. arbetern reads these to
      # enforce per-agent allowed_emails RBAC (see customConfigs below). The
      # proxy strips any client-supplied copies, so they can't be spoofed.
      set_xauthrequest = true
      # Paths that bypass auth (RE2 regex). Add entries to expose more.
      skip_auth_routes = [
        "^/healthz",
        "^/favicon\\.svg$",
        "^/[^/]+/webhook$"
      ]
  # Prometheus metrics endpoint is enabled by default upstream.
  metrics:
    enabled: false

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ai.example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - ai.example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi

# Go runtime memory tuning — should be sized in relation to resources.limits.memory above.
# GOMEMLIMIT: soft memory ceiling for the Go runtime (set ~12% below the hard limit to avoid OOM kills).
# GOGC: GC target percentage — higher value = less frequent GC = more memory used between collections.
goRuntime:
  goMemLimit: "1750MiB"
  goGC: "200"

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumesMounts: []
# Custom prompts — org-specific context appended to built-in agent prompts via ConfigMap.
# Each key is an agent ID; values are prompt key/value pairs that get APPENDED (not overridden)
# to the agent's existing prompts. This lets you inject deployment-specific context without
# modifying the source prompts.yaml files.
# Example:
# customPrompts:
#   ovad:
#     general: |
#       Our GitHub org is "acme-corp". Default repo for infra is "infra-live".
#       Terraform state is in S3 bucket "acme-tf-state".
#   goldsai:
#     general: |
#       Our container base images are hosted in ECR at 123456789.dkr.ecr.us-east-1.amazonaws.com.
#       All Python services must use Python >= 3.13.11.
customPrompts: {}

# Custom per-agent config overrides — override agent config.yaml settings at
# deploy time via ConfigMap, without rebuilding the image. Each key is an agent
# ID; values are a (possibly partial) copy of that agent's config.yaml. Because
# the override is a full config file, only the keys you set take effect and
# everything else falls through to the baked-in config.yaml — and any field
# added to the agent config in the future is overridable here automatically.
# Supported fields today: name, allowed_teams, allowed_emails, chat_enabled.
#   - chat_enabled: turn on the centralized UI chat for an agent.
#   - allowed_teams: restrict the agent to the listed Slack user group
#     (subteam) IDs. This is how you do per-agent RBAC at deploy time; when set,
#     only members of those groups can use the agent. Omit/empty = no
#     restriction.
#   - allowed_emails: restrict the agent's UI chat (/ui/<agent>/chat and the
#     /api/chat API) to the listed identities, matched against the email that
#     oauth2-proxy injects. Entries may be exact addresses (alice@acme.com) or
#     a whole domain (acme.com). Requires oauth2-proxy (set_xauthrequest=true).
#     Omit/empty = no restriction.
# Example:
# customConfigs:
#   ovad:
#     chat_enabled: true
#   pulse:
#     allowed_teams:
#       - S0A6S3KNNLW   # CS team
#       - S0B7T4LOOLX   # DevOps team
#     allowed_emails:
#       - solutions@acme.com
#       - acme.com
customConfigs: {}

# Per-agent credential overrides. Each key is an agent ID; values are the same
# kebab-case keys used in `secretValues` (e.g. sf-consumer-key, atlassian-api-token,
# chorus-api-token, dd-api-key-us, ...). For every entry the chart provisions a
# Secret named `arbetern-<agent>-secrets` and mounts it at
# /etc/arbetern/agent-credentials/<agent>/. At runtime the app starts each agent
# with the global credentials from `secretName` and overlays only the keys
# present here — anything you do not override falls through to the global value.
#
# Use this when one agent needs its own Salesforce app / Atlassian tenant /
# Datadog account / etc. while the rest of the fleet keeps using the shared
# credentials.
#
# When `createSecret` is true the chart writes the values below verbatim into
# each per-agent Secret. When false (recommended for production) create the
# per-agent secrets yourself, e.g.:
#   kubectl create secret generic arbetern-ovad-secrets \
#     --from-literal=sf-consumer-key=3MVG9... \
#     --from-literal=sf-consumer-secret=...
# and leave the value below as an empty map (the chart will still mount any
# Secret that exists with the matching name).
#
# Example:
# customCredentials:
#   ovad:
#     sf-consumer-key: "REPLACE_ME"
#     sf-consumer-secret: "REPLACE_ME"
#   pulse:
#     chorus-api-token: "REPLACE_ME"
customCredentials: {}
nodeSelector: {}
tolerations: []
affinity: {}

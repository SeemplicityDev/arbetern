{{- /*
Per-agent credential override Secrets.

For every agent listed under `.Values.customCredentials` we provision a
separate Secret named `arbetern-<agent>-secrets`. The statefulset mounts
each one at /etc/arbetern/agent-credentials/<agent>/<key> so the app can
read per-agent overrides at startup and overlay them on top of the
global secret values.

When `.Values.createSecret` is false the chart skips creating these
resources — operators are expected to provision the Secrets out of band
(e.g. via Sealed Secrets / External Secrets). The statefulset still
mounts them by name.
*/ -}}
{{- if and .Values.createSecret .Values.customCredentials }}
{{- range $agentID, $creds := .Values.customCredentials }}
{{- if $creds }}
---
apiVersion: v1
kind: Secret
metadata:
  name: arbetern-{{ $agentID }}-secrets
  labels:
    {{- include "arbetern.labels" $ | nindent 4 }}
    arbetern.io/agent: {{ $agentID | quote }}
type: Opaque
stringData:
  {{- range $key, $value := $creds }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}

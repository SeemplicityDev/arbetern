{{- if and .Values.dashboards.enabled .Values.dashboards.persistence.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "arbetern.fullname" . }}-dashboards
  labels:
    {{- include "arbetern.labels" . | nindent 4 }}
  {{- with .Values.dashboards.persistence.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.dashboards.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.dashboards.persistence.size | quote }}
  {{- with .Values.dashboards.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}

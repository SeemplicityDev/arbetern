{{- if and .Values.projects .Values.projects.enabled .Values.projects.networkPolicy.enabled }}
{{- $ns := include "arbetern.projects.namespace" . }}
{{- $egress := .Values.projects.sessions.egress }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "arbetern.fullname" . }}-session-default-deny
  namespace: {{ $ns }}
  labels:
    {{- include "arbetern.projects.labels" . | nindent 4 }}
spec:
  {{- if eq $ns .Release.Namespace }}
  podSelector:
    matchLabels:
      {{- include "arbetern.projects.selectorLabels" . | nindent 6 }}
  {{- else }}
  podSelector: {}
  {{- end }}
  policyTypes:
    - Ingress
    - Egress
---
{{- /* Sessions reach the model and GitHub only through the gateway; an egress rule with an empty "to" allows every destination, so CIDR rules render only for non-empty lists. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "arbetern.fullname" . }}-session-egress
  namespace: {{ $ns }}
  labels:
    {{- include "arbetern.projects.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "arbetern.projects.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "arbetern.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.projects.gateway.port }}
    {{- with $egress.extraCIDRs }}
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- with $egress.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "arbetern.fullname" . }}-ingress
  labels:
    {{- include "arbetern.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "arbetern.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
          podSelector:
            matchLabels:
              {{- include "arbetern.projects.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.projects.gateway.port }}
{{- end }}

{{- if and .Values.projects .Values.projects.enabled .Values.projects.networkPolicy.enabled }}
{{- $ns := include "arbetern.projects.namespace" . }}
{{- $egress := .Values.projects.runners.egress }}
{{- $sessionCIDRs := concat ($egress.anthropicCIDRs | default list) ($egress.extraCIDRs | default list) }}
{{- /* An egress rule with an empty "to" allows every destination, so CIDR rules render only for non-empty lists. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "arbetern.fullname" . }}-runner-default-deny
  namespace: {{ $ns }}
  labels:
    {{- include "arbetern.projects.labels" . | nindent 4 }}
spec:
  {{- if eq $ns .Release.Namespace }}
  podSelector:
    matchLabels:
      {{- include "arbetern.projects.selectorLabels" . | nindent 6 }}
  {{- else }}
  podSelector: {}
  {{- end }}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "arbetern.fullname" . }}-session-runner-egress
  namespace: {{ $ns }}
  labels:
    {{- include "arbetern.projects.labels" . | nindent 4 }}
    app.kubernetes.io/component: session-runner
spec:
  podSelector:
    matchLabels:
      {{- include "arbetern.projects.sessionRunnerSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "arbetern.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.projects.gateway.port }}
    {{- with $sessionCIDRs }}
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- with $egress.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "arbetern.fullname" . }}-orchestrator-egress
  namespace: {{ $ns }}
  labels:
    {{- include "arbetern.projects.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  podSelector:
    matchLabels:
      {{- include "arbetern.projects.orchestratorSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- with $egress.anthropicCIDRs }}
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- with .Values.projects.runners.orchestrator.apiServerCIDRs }}
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    {{- end }}
    {{- with $egress.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "arbetern.fullname" . }}-ingress
  labels:
    {{- include "arbetern.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "arbetern.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
          podSelector:
            matchLabels:
              {{- include "arbetern.projects.sessionRunnerSelectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.projects.gateway.port }}
{{- end }}

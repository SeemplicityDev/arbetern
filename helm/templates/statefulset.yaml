apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "arbetern.fullname" . }}
  labels:
    {{- include "arbetern.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "arbetern.fullname" . }}
  podManagementPolicy: Parallel
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "arbetern.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "arbetern.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "arbetern.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.headroom.enabled }}
            - name: HEADROOM_PROXY_URL
              value: "http://localhost:{{ .Values.headroom.port }}"
            {{- with .Values.headroom.compressTimeout }}
            - name: HEADROOM_COMPRESS_TIMEOUT
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: slack-bot-token
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: slack-signing-secret
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: github-token
            {{- if index .Values.secretValues "azure-openai-endpoint" }}
            - name: AZURE_OPEN_AI_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: azure-openai-endpoint
            - name: AZURE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: azure-api-key
            {{- end }}
            {{- if index .Values.secretValues "atlassian-url" }}
            - name: ATLASSIAN_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: atlassian-url
            - name: ATLASSIAN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: atlassian-email
            - name: ATLASSIAN_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: atlassian-api-token
            {{- end }}
            {{- if index .Values.secretValues "atlassian-client-id" }}
            - name: ATLASSIAN_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: atlassian-client-id
            - name: ATLASSIAN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: atlassian-client-secret
            {{- end }}
            {{- if index .Values.secretValues "jira-project" }}
            - name: JIRA_PROJECT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: jira-project
            {{- end }}
            {{- if index .Values.secretValues "slack-app-token" }}
            - name: SLACK_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: slack-app-token
            {{- end }}
            {{- if index .Values.secretValues "nvd-api-key" }}
            - name: NVD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: nvd-api-key
            {{- end }}
            {{- if index .Values.secretValues "sf-consumer-key" }}
            - name: SF_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: sf-consumer-key
            - name: SF_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: sf-consumer-secret
            {{- end }}
            {{- if index .Values.secretValues "sf-login-url" }}
            - name: SF_LOGIN_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: sf-login-url
            {{- end }}
            {{- if index .Values.secretValues "chorus-api-token" }}
            - name: CHORUS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: chorus-api-token
            {{- end }}
            {{- if index .Values.secretValues "chorus-base-url" }}
            - name: CHORUS_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: chorus-base-url
            {{- end }}
            {{- if index .Values.secretValues "dd-api-key-us" }}
            - name: DD_API_KEY_US
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: dd-api-key-us
            - name: DD_APP_KEY_US
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: dd-app-key-us
            {{- end }}
            {{- if index .Values.secretValues "dd-api-key-eu" }}
            - name: DD_API_KEY_EU
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: dd-api-key-eu
            - name: DD_APP_KEY_EU
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: dd-app-key-eu
            {{- end }}
            {{- if index .Values.secretValues "aws-access-key-id" }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: aws-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: aws-secret-access-key
            {{- end }}
            {{- if index .Values.secretValues "aws-session-token" }}
            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: aws-session-token
            {{- end }}
            {{- if index .Values.secretValues "azure-tenant-id" }}
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: azure-tenant-id
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: azure-client-id
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: azure-client-secret
            {{- if index .Values.secretValues "azure-management-group-id" }}
            - name: AZURE_MANAGEMENT_GROUP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: azure-management-group-id
            {{- end }}
            {{- if index .Values.secretValues "azure-billing-account-id" }}
            - name: AZURE_BILLING_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: azure-billing-account-id
            {{- end }}
            {{- end }}
            {{- if index .Values.secretValues "databricks-host" }}
            - name: DATABRICKS_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: databricks-host
            - name: DATABRICKS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: databricks-client-id
            - name: DATABRICKS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: databricks-client-secret
            - name: DATABRICKS_WAREHOUSE_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: databricks-warehouse-id
            {{- end }}
            {{- if index .Values.secretValues "clickhouse-key-id" }}
            - name: CLICKHOUSE_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: clickhouse-key-id
            - name: CLICKHOUSE_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: clickhouse-key-secret
            - name: CLICKHOUSE_ORGANIZATION_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: clickhouse-organization-id
            {{- end }}
            {{- if index .Values.secretValues "clickhouse-query-endpoint" }}
            - name: CLICKHOUSE_QUERY_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: clickhouse-query-endpoint
            - name: CLICKHOUSE_QUERY_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: clickhouse-query-user
            - name: CLICKHOUSE_QUERY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: clickhouse-query-password
            {{- end }}
            {{- if index .Values.secretValues "freshdesk-domain" }}
            - name: FRESHDESK_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: freshdesk-domain
            - name: FRESHDESK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: freshdesk-api-key
            {{- end }}
            {{- if index .Values.secretValues "freshchat-url" }}
            - name: FRESHCHAT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: freshchat-url
            - name: FRESHCHAT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: freshchat-api-token
            {{- end }}
            {{- if index .Values.secretValues "freshworks-crm-domain" }}
            - name: FRESHWORKS_CRM_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: freshworks-crm-domain
            - name: FRESHWORKS_CRM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: freshworks-crm-api-key
            {{- end }}
            - name: GOMEMLIMIT
              value: {{ .Values.goRuntime.goMemLimit | quote }}
            - name: GOGC
              value: {{ .Values.goRuntime.goGC | quote }}
            {{- if .Values.customPrompts }}
            - name: CUSTOM_PROMPTS_DIR
              value: /etc/arbetern/custom-prompts
            {{- end }}
            {{- if .Values.customConfigs }}
            - name: CUSTOM_CONFIG_DIR
              value: /etc/arbetern/custom-config
            {{- end }}
            {{- if .Values.customCredentials }}
            - name: AGENT_CREDENTIALS_DIR
              value: /etc/arbetern/agent-credentials
            {{- end }}
            {{- if .Values.dashboards.enabled }}
            - name: DASHBOARDS_DIR
              value: "{{ .Values.persistence.mountPath }}/{{ .Values.dashboards.subPath }}"
            {{- if and .Values.dashboards.gitops .Values.dashboards.gitops.enabled }}
            {{- if .Values.dashboards.gitops.owner }}
            - name: DASHBOARDS_GITOPS_OWNER
              value: "{{ .Values.dashboards.gitops.owner }}"
            {{- end }}
            - name: DASHBOARDS_GITOPS_REPO
              value: "{{ required "dashboards.gitops.repo is required when dashboards.gitops.enabled" .Values.dashboards.gitops.repo }}"
            {{- if .Values.dashboards.gitops.branch }}
            - name: DASHBOARDS_GITOPS_BRANCH
              value: "{{ .Values.dashboards.gitops.branch }}"
            {{- end }}
            {{- if .Values.dashboards.gitops.basePath }}
            - name: DASHBOARDS_GITOPS_BASE_PATH
              value: "{{ .Values.dashboards.gitops.basePath }}"
            {{- end }}
            {{- if .Values.dashboards.gitops.interval }}
            - name: DASHBOARDS_GITOPS_INTERVAL
              value: "{{ .Values.dashboards.gitops.interval }}"
            {{- end }}
            - name: DASHBOARDS_GITOPS_PRUNE
              value: {{ .Values.dashboards.gitops.prune | default true | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.workflows.enabled }}
            - name: WORKFLOWS_DIR
              value: "{{ .Values.persistence.mountPath }}/{{ .Values.workflows.subPath }}"
            {{- if and .Values.workflows.gitops .Values.workflows.gitops.enabled }}
            {{- if .Values.workflows.gitops.owner }}
            - name: WORKFLOWS_GITOPS_OWNER
              value: "{{ .Values.workflows.gitops.owner }}"
            {{- end }}
            - name: WORKFLOWS_GITOPS_REPO
              value: "{{ required "workflows.gitops.repo is required when workflows.gitops.enabled" .Values.workflows.gitops.repo }}"
            {{- if .Values.workflows.gitops.branch }}
            - name: WORKFLOWS_GITOPS_BRANCH
              value: "{{ .Values.workflows.gitops.branch }}"
            {{- end }}
            {{- if .Values.workflows.gitops.basePath }}
            - name: WORKFLOWS_GITOPS_BASE_PATH
              value: "{{ .Values.workflows.gitops.basePath }}"
            {{- end }}
            {{- if .Values.workflows.gitops.interval }}
            - name: WORKFLOWS_GITOPS_INTERVAL
              value: "{{ .Values.workflows.gitops.interval }}"
            {{- end }}
            - name: WORKFLOWS_GITOPS_PRUNE
              value: {{ .Values.workflows.gitops.prune | default true | quote }}
            {{- end }}
            {{- end }}
            {{- if and .Values.persistence.enabled .Values.userContext .Values.userContext.enabled }}
            - name: USER_CONTEXT_DIR
              value: "{{ .Values.persistence.mountPath }}/{{ .Values.userContext.subPath }}"
            {{- end }}
            {{- if and .Values.persistence.enabled .Values.chat .Values.chat.enabled }}
            - name: CHAT_DIR
              value: "{{ .Values.persistence.mountPath }}/{{ .Values.chat.subPath }}"
            {{- end }}
            {{- if and .Values.persistence.enabled .Values.billing .Values.billing.enabled }}
            - name: BILLING_DIR
              value: "{{ .Values.persistence.mountPath }}/{{ .Values.billing.subPath }}"
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.customPrompts }}
          {{- if not .Values.volumeMounts }}
          volumeMounts:
          {{- end }}
            - name: custom-prompts
              mountPath: /etc/arbetern/custom-prompts
              readOnly: true
          {{- end }}
          {{- if .Values.customConfigs }}
          {{- if and (not .Values.volumeMounts) (not .Values.customPrompts) }}
          volumeMounts:
          {{- end }}
            - name: custom-config
              mountPath: /etc/arbetern/custom-config
              readOnly: true
          {{- end }}
          {{- if .Values.customCredentials }}
          {{- if and (not .Values.volumeMounts) (not .Values.customPrompts) (not .Values.customConfigs) }}
          volumeMounts:
          {{- end }}
          {{- range $agentID, $creds := .Values.customCredentials }}
          {{- if $creds }}
            - name: agent-credentials-{{ $agentID }}
              mountPath: /etc/arbetern/agent-credentials/{{ $agentID }}
              readOnly: true
          {{- end }}
          {{- end }}
          {{- end }}
          {{- if .Values.persistence.enabled }}
          {{- if and (not .Values.volumeMounts) (not .Values.customPrompts) (not .Values.customConfigs) (not .Values.customCredentials) }}
          volumeMounts:
          {{- end }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
          {{- end }}
        {{- if .Values.headroom.enabled }}
        # Headroom compression sidecar — the app POSTs conversations to its
        # /v1/compress endpoint (via HEADROOM_PROXY_URL) before each LLM call.
        - name: headroom
          image: "{{ .Values.headroom.image.repository }}:{{ .Values.headroom.image.tag }}"
          imagePullPolicy: {{ .Values.headroom.image.pullPolicy }}
          # Image ENTRYPOINT is already `headroom proxy`; override it so the
          # `proxy` arg below isn't doubled into `headroom proxy proxy` (crash).
          command:
            - "headroom"
          args:
            - "proxy"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - {{ .Values.headroom.port | quote }}
            {{- if not .Values.headroom.telemetry }}
            - "--no-telemetry"
            {{- end }}
            {{- with .Values.headroom.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: headroom
              containerPort: {{ .Values.headroom.port }}
              protocol: TCP
          env:
            # Writable HOME for the non-root user (Headroom caches under ~/.headroom).
            - name: HOME
              value: /tmp
            {{- range $key, $value := .Values.headroom.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: headroom
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: headroom
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.headroom.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.headroom.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.customPrompts }}
      {{- if not .Values.volumes }}
      volumes:
      {{- end }}
        - name: custom-prompts
          configMap:
            name: {{ include "arbetern.fullname" . }}-custom-prompts
      {{- end }}
      {{- if .Values.customConfigs }}
      {{- if and (not .Values.volumes) (not .Values.customPrompts) }}
      volumes:
      {{- end }}
        - name: custom-config
          configMap:
            name: {{ include "arbetern.fullname" . }}-custom-config
      {{- end }}
      {{- if .Values.customCredentials }}
      {{- if and (not .Values.volumes) (not .Values.customPrompts) (not .Values.customConfigs) }}
      volumes:
      {{- end }}
      {{- range $agentID, $creds := .Values.customCredentials }}
      {{- if $creds }}
        - name: agent-credentials-{{ $agentID }}
          secret:
            secretName: arbetern-{{ $agentID }}-secrets
            optional: true
      {{- end }}
      {{- end }}
      {{- end }}
      {{- if and .Values.persistence.enabled (not .Values.persistence.persistentVolumeClaim.enabled) }}
      {{- if and (not .Values.volumes) (not .Values.customPrompts) (not .Values.customConfigs) (not .Values.customCredentials) }}
      volumes:
      {{- end }}
        - name: data
          emptyDir: {}
      {{- end }}
      {{- /* When persistence.persistentVolumeClaim.enabled is true, the "data"
             volume is supplied by volumeClaimTemplates below (StatefulSet only). */ -}}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and .Values.persistence.enabled .Values.persistence.persistentVolumeClaim.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "arbetern.labels" . | nindent 10 }}
        {{- with .Values.persistence.persistentVolumeClaim.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.persistentVolumeClaim.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.persistence.persistentVolumeClaim.size | quote }}
        {{- with .Values.persistence.persistentVolumeClaim.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
  {{- end }}

{{- if .Values.ingress.enabled -}}
{{- $oauth2 := index .Values "oauth2-proxy" | default dict -}}
{{- $backendSvc := include "arbetern.fullname" . -}}
{{- $backendPort := .Values.service.port -}}
{{- if $oauth2.enabled -}}
{{/* When oauth2-proxy is enabled, backend the proxy Service so auth is enforced. */}}
{{- $backendSvc = printf "%s-oauth2-proxy" .Release.Name -}}
{{- $backendPort = ((index $oauth2 "service") | default dict).portNumber | default 80 -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "arbetern.fullname" . }}
  labels:
    {{- include "arbetern.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- with .pathType }}
            pathType: {{ . }}
            {{- end }}
            backend:
              service:
                name: {{ $backendSvc }}
                port:
                  number: {{ $backendPort }}
          {{- end }}
    {{- end }}
{{- end }}

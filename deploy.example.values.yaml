# Example local values for Helm deployment.
# Copy this file to deploy.local.values.yaml and fill in your values.
# deploy.local.values.yaml is gitignored and will not be committed.

image:
  repository: your-registry/arbetern
  tag: latest

createSecret: true

env:
  UI_HEADER: "arbetern"
  APP_URL: "https://your-app-url.example.com"
  GENERAL_MODEL: "gpt-4o"
  # CODE_MODEL: "gpt-4o"  # Separate model for code tasks (search, file edits, PRs). Defaults to GENERAL_MODEL.
  # UI_ALLOWED_CIDRS: "0.0.0.0/0"
  # AWS_REGION: "us-east-1"   # Cost Explorer SigV4 signing region. CE is global; us-east-1 is the canonical choice.

# Headroom context-compression sidecar (optional — cuts LLM token usage).
# When enabled, arbetern compresses each conversation via the in-pod headroom
# /v1/compress endpoint before calling the model — works with any backend
# (GitHub Models, Azure OpenAI, Azure Foundry/Claude). See docs/HEADROOM.md.
# headroom:
#   enabled: true
#   # resources:
#   #   requests: { cpu: 100m, memory: 512Mi }
#   #   limits:   { cpu: "1",  memory: 1Gi }

secretValues:
  github-token: "ghp_your_github_token"
  slack-bot-token: "xoxb-your-slack-bot-token"
  slack-signing-secret: "your-slack-signing-secret"
  # Azure OpenAI (optional — omit to use GitHub Models)
  # azure-openai-endpoint: "https://your-endpoint.openai.azure.com/"
  # azure-api-key: "your-azure-api-key"
  # Jira (optional)
  # jira-url: "https://yourorg.atlassian.net/"
  # jira-email: "your-service-account@yourorg.atlassian.net"
  # jira-api-token: "your-jira-api-token"
  # jira-project: "PROJ"
  # Jira OAuth (alternative to email+token)
  # jira-client-id: "your-jira-client-id"
  # jira-client-secret: "your-jira-client-secret"
  # NVD CVE API (optional — enables real-time CVE lookups for goldsai)
  # nvd-api-key: "your-nvd-api-key"
  # Salesforce (optional — enables SOQL queries for the CS agent, Pulse)
  # sf-consumer-key: "your-sf-consumer-key"
  # sf-consumer-secret: "your-sf-consumer-secret"
  # sf-login-url: "https://login.salesforce.com"  # use https://test.salesforce.com for sandboxes
  # Chorus / ZoomInfo (optional — enables call intelligence and deal momentum for Pulse)
  # chorus-api-token: "your-chorus-api-token"  # Chorus → Personal Settings → API Token
  # chorus-base-url: "https://chorus.ai"        # override for on-prem / custom endpoint
  # Datadog (optional — enables log search, monitors, infrastructure, and dashboards)
  # Configure US, EU, or both. The site is inferred from user prompts and URLs.
  # dd-api-key-us: "your-dd-api-key-us"   # Datadog US (datadoghq.com) → Organization Settings → API Keys
  # dd-app-key-us: "your-dd-app-key-us"   # Datadog US → Organization Settings → Application Keys
  # dd-api-key-eu: "your-dd-api-key-eu"   # Datadog EU (datadoghq.eu) → Organization Settings → API Keys
  # dd-app-key-eu: "your-dd-app-key-eu"   # Datadog EU → Organization Settings → Application Keys
  # AWS Cost Explorer (optional — enables aws_get_cost_and_usage / aws_get_cost_forecast / aws_list_dimension_values).
  # Preferred auth on EKS is IRSA — annotate the service account instead of setting static keys:
  #   serviceAccount:
  #     annotations:
  #       eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/arbetern-cost-explorer
  # The IAM role needs ce:GetCostAndUsage, ce:GetCostForecast, ce:GetDimensionValues.
  # Each CE API call costs $0.01 — keep an eye on workflow intervals.
  # Static credentials are a fallback for non-EKS clusters:
  # aws-access-key-id: "AKIA..."
  # aws-secret-access-key: "your-aws-secret-access-key"
  # aws-session-token: ""  # only needed for STS temporary credentials
  # Azure Cost Management (optional — enables azure_get_cost_and_usage / azure_get_cost_forecast / azure_list_dimension_values).
  # For Enterprise Agreement tenants: grant the SP "Enterprise Reader" on the EA billing account and set azure-billing-account-id.
  # For PAYG / MCA / CSP: grant the SP "Cost Management Reader" at the tenant root management group (leave azure-management-group-id empty).
  # azure-tenant-id: "00000000-0000-0000-0000-000000000000"
  # azure-client-id: "00000000-0000-0000-0000-000000000000"
  # azure-client-secret: "your-azure-client-secret"
  # azure-billing-account-id: ""     # EA enrollment number (preferred for EA tenants)
  # azure-management-group-id: ""    # MG scope (preferred for non-EA tenants); defaults to tenant root MG
  # Databricks SQL warehouse (optional — enables the read-only databricks_query tool for the ovad agent only).
  # OAuth M2M: create a workspace service principal + OAuth secret, grant it CAN USE on the warehouse and
  # SELECT on the catalogs/schemas you want queryable. All four keys are required. See docs/DATABRICKS.md.
  # Tip: prefer mounting these under customCredentials.ovad below so only ovad gets them.
  # databricks-host: "https://dbc-1234abcd-5678.cloud.databricks.com"
  # databricks-client-id: "00000000-0000-0000-0000-000000000000"
  # databricks-client-secret: "your-databricks-oauth-secret"
  # databricks-warehouse-id: "1234567890abcdef"
  # ClickHouse Cloud (optional — enables the read-only clickhouse_usage_cost tool for the ovad agent only).
  # HTTP Basic auth: create an API key (key ID + secret) in the ClickHouse Cloud console and note your
  # organization ID. All three keys are required. See docs/CLICKHOUSE.md.
  # Tip: prefer mounting these under customCredentials.ovad below so only ovad gets them.
  # clickhouse-key-id: "your-clickhouse-key-id"
  # clickhouse-key-secret: "your-clickhouse-key-secret"
  # clickhouse-organization-id: "00000000-0000-0000-0000-000000000000"

# ingress:
#   enabled: true
#   className: nginx
#   annotations: {}
#   hosts:
#     - host: arbetern.example.com
#       paths:
#         - path: /
#           pathType: Prefix

# OAuth2 SSO in front of the UI (oauth2-proxy subchart, disabled by default).
# When enabled, the ingress is auto-rewired to the proxy so /ui/ and /api/
# require login; Slack webhooks and /healthz stay public. Register
# https://<your-host>/oauth2/callback as a redirect URI in your OAuth provider.
# oauth2-proxy:
#   enabled: true
#   config:
#     clientID: "your-oauth-client-id"
#     clientSecret: "your-oauth-client-secret"
#     cookieSecret: "your-cookie-secret"  # openssl rand -base64 32 | tr -- '+/' '-_'

# Custom prompts — org-specific context appended to agent prompts via ConfigMap.
# customPrompts:
#   ovad:
#     general: |
#       Our GitHub org is "acme-corp". Default repo for infra is "infra-live".
#       Terraform state is in S3 bucket "acme-tf-state".
#   goldsai:
#     general: |
#       Our container base images are hosted in ECR at 123456789.dkr.ecr.us-east-1.amazonaws.com.
#       All Python services must use Python >= 3.13.11.

# Per-agent config overrides — override agent config.yaml settings at deploy
# time (without rebuilding the image). The override is a full config file, so
# only the keys you set take effect; everything else falls through to the
# baked-in config.yaml, and any field added to the agent config in the future is
# overridable here automatically. Supported fields today: name, allowed_teams,
# allowed_emails, chat_enabled.
#   - chat_enabled: turn on the centralized UI chat for an agent.
#   - allowed_teams: restrict the agent to the listed Slack user group IDs
#     (deploy-time RBAC); only members of those groups can use the agent. Also
#     the fallback layer for UI chat access (see below).
#   - allowed_emails: restrict the agent's UI chat. Access is evaluated in two
#     layers: (1) allowed_emails (primary) matched against the email
#     oauth2-proxy injects — exact addresses (alice@acme.com) or whole domains
#     (acme.com); (2) allowed_teams (fallback) — the email is resolved to a
#     Slack user and checked for team membership; (3) otherwise 403.
#     Requires oauth2-proxy; the fallback also needs the Slack users:read.email
#     scope.
# Example:
# customConfigs:
#   ovad:
#     chat_enabled: true
#   pulse:
#     chat_enabled: true
#     allowed_teams:
#       - S0A6S3KNNLW   # CS team
#       - S0B7T4LOOLX   # DevOps team
#     allowed_emails:
#       - solutions@acme.com
#       - acme.com

# Per-agent credential overrides — keys match the kebab-case names from
# secretValues. Each entry produces a Secret named `arbetern-<agent>-secrets`
# (when createSecret=true) mounted at /etc/arbetern/agent-credentials/<agent>/.
# Any key not overridden falls through to the global secretValues. Use this
# when a single agent needs its own Salesforce app / Atlassian tenant / etc.
# customCredentials:
#   ovad:
#     sf-consumer-key: "REPLACE_ME"
#     sf-consumer-secret: "REPLACE_ME"
#     # Databricks is gated to ovad in code, so mounting it here keeps the
#     # credentials off every other agent. See docs/DATABRICKS.md.
#     databricks-host: "https://dbc-1234abcd-5678.cloud.databricks.com"
#     databricks-client-id: "00000000-0000-0000-0000-000000000000"
#     databricks-client-secret: "REPLACE_ME"
#     databricks-warehouse-id: "1234567890abcdef"
#     # ClickHouse Cloud is also gated to ovad in code; mounting it here keeps
#     # the credentials off every other agent. See docs/CLICKHOUSE.md.
#     clickhouse-key-id: "REPLACE_ME"
#     clickhouse-key-secret: "REPLACE_ME"
#     clickhouse-organization-id: "00000000-0000-0000-0000-000000000000"
#   pulse:
#     chorus-api-token: "REPLACE_ME"

# Dashboards + workflows share a single persistent data directory.
# Enable the PVC to keep state across pod restarts; leave disabled for
# ephemeral/dev environments where emptyDir is fine.
# dashboards:
#   enabled: true
# workflows:
#   enabled: true
#   # GitOps: poll a remote GitHub repo and reconcile workflow JSON
#   # descriptors found at <basePath>/<agent>/<id>.json into the local
#   # registry on `interval`. See docs/WORKFLOWS_GITOPS.md.
#   gitops:
#     enabled: true
#     # owner: "your-org"        # optional; defaults to bot's resolved owner
#     repo: "<your-workflows-repo>"
#     # branch: "main"           # empty == repo default branch
#     basePath: "arbetern/workflows"
#     interval: "5m"
#     prune: false               # set true to delete workflows removed from git
# persistence:
#   enabled: true
#   mountPath: /var/lib/arbetern
#   persistentVolumeClaim:
#     enabled: true
#     size: 2Gi
#     storageClass: "gp3"

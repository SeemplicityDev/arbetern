<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>arbetern — workflow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>(function(){try{var t=localStorage.getItem('arbetern-theme');if(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)t='light';document.documentElement.dataset.theme=t||'dark';}catch(e){document.documentElement.dataset.theme='dark';}})();</script>
  <style>
    :root {
      /* ── arbetern "Night Shift" design tokens ──
         Keep in sync across ui/index.html, dashboards/view.html,
         workflows/view.html. */
      --bg:#0c0e13; --surface:#11141b; --surface-glass:#11141b;
      --card:#151923; --card-2:#1a1f2b; --card-hover:#1f2533;
      --border:#272e3c; --border-accent:#3a4456;
      --text:#c3cbd8; --text-bright:#e9edf4; --text-muted:#7f8a9b;
      --accent:#7297bd; --accent-2:#8f87b8; --gold:#c0a368;
      --green:#83b08a; --red:#c47f7f; --amber:#c79a5e; --cyan:#76a8b8;
      --deep:#0a0c10;
      --on-accent:#10131a;
      color-scheme:dark;
      --font-display:'Bricolage Grotesque','Archivo',sans-serif;
      --font-body:'Archivo',-apple-system,'Segoe UI',sans-serif;
      --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;
      --shadow:0 1px 2px rgba(0,0,0,.3);
    }
    /* Light theme — matte paper */
    html[data-theme="light"]{
      --bg:#e8eaed; --surface:#f3f4f6; --surface-glass:#f3f4f6;
      --card:#fbfbfc; --card-2:#eff1f3; --card-hover:#e7eaee;
      --border:#d3d8de; --border-accent:#b4bcc7;
      --text:#3b4350; --text-bright:#161c25; --text-muted:#67717e;
      --accent:#46688e; --accent-2:#6a6293; --gold:#94783c;
      --green:#4d7a57; --red:#a35454; --amber:#96702f; --cyan:#3d7287;
      --deep:#eceef1;
      --on-accent:#f6f8fa;
      --shadow:0 1px 2px rgba(25,35,50,.1);
      color-scheme:light;
    }
    html[data-theme="light"] body::before{
      background-image:linear-gradient(rgba(50,62,80,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(50,62,80,.05) 1px,transparent 1px)}
    html[data-theme="light"] .modal-backdrop{background:rgba(40,46,56,.45)}
    .theme-toggle{position:relative;width:46px;height:24px;flex-shrink:0;border-radius:20px;background:var(--card-2);border:1px solid var(--border);cursor:pointer;padding:0;transition:background .2s ease,border-color .2s ease}
    .theme-toggle:hover{border-color:var(--border-accent)}
    .theme-toggle-knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;transform:translateX(22px);transition:transform .3s cubic-bezier(.22,1,.36,1)}
    html[data-theme="light"] .theme-toggle-knob{transform:translateX(0)}
    .theme-toggle .tt-sun{display:none}
    html[data-theme="light"] .theme-toggle .tt-sun{display:block}
    html[data-theme="light"] .theme-toggle .tt-moon{display:none}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-body);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;background:var(--bg)}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
      background-image:linear-gradient(rgba(143,152,168,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(143,152,168,.04) 1px,transparent 1px);
      background-size:44px 44px;
      -webkit-mask-image:radial-gradient(ellipse 90% 65% at 50% 0%,#000 0%,transparent 100%);
      mask-image:radial-gradient(ellipse 90% 65% at 50% 0%,#000 0%,transparent 100%)}
    header{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:10}
    header::before{content:'';position:absolute;inset:0 0 auto 0;height:2px;background:var(--gold)}
    header h1{font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:-.3px;color:var(--text-bright)}
    header .meta{font-size:12px;color:var(--text-muted);margin-top:2px}
    header .badge{font-family:var(--font-mono);font-size:11px;padding:4px 12px;border-radius:20px;background:var(--card);border:1px solid var(--border);color:var(--text-muted);font-weight:500}
    header .badge.ok{color:var(--green);border-color:rgba(131,176,138,.35);background:rgba(131,176,138,.07)}
    header .badge.err{color:var(--red);border-color:rgba(196,127,127,.35);background:rgba(196,127,127,.07)}
    header .badge.paused{color:var(--amber);border-color:rgba(199,154,94,.35);background:rgba(199,154,94,.07)}
    header .badge.running{color:var(--accent);border-color:rgba(114,151,189,.45);background:rgba(114,151,189,.1);animation:pulse 1.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
    main{max-width:1200px;margin:0 auto;padding:28px 24px 60px;position:relative;z-index:1}
    .description{color:var(--text-muted);font-size:13px;margin-bottom:24px;max-width:820px;line-height:1.6}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:18px;animation:rise .5s cubic-bezier(.16,1,.3,1) backwards}
    .card:nth-of-type(1){animation-delay:.03s}.card:nth-of-type(2){animation-delay:.09s}.card:nth-of-type(3){animation-delay:.15s}.card:nth-of-type(4){animation-delay:.21s}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .card-title{font-family:var(--font-display);font-size:12px;font-weight:700;color:var(--text-bright);text-transform:uppercase;letter-spacing:1.6px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
    .card-title::before{content:'';width:7px;height:7px;background:var(--gold);flex-shrink:0}
    .card-title .count{background:var(--card-2);border:1px solid var(--border);border-radius:10px;padding:2px 8px;font-size:10px;color:var(--text);font-family:var(--font-mono)}
    .meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
    .meta-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px}
    .meta-item .label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
    .meta-item .value{font-size:14px;color:var(--text-bright);font-weight:500;word-break:break-word}

    /* Flow diagram */
    .flow{display:flex;flex-direction:column;gap:0;align-items:stretch}
    .flow-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:stretch;min-height:64px}
    .flow-connector{display:flex;justify-content:center;margin:6px 0;color:var(--border-accent)}
    .flow-connector svg{width:18px;height:32px}
    .flow-lane-label{text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;margin:4px 0 6px}
    .node{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px 18px;background:var(--card-2);border:1px solid var(--border-accent);border-radius:14px;min-width:128px;min-height:86px;transition:background .15s ease,border-color .15s ease}
    .node:hover{background:var(--card-hover);border-color:var(--accent)}
    .node .icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--card-2);border:1px solid var(--border);flex-shrink:0}
    .node .icon svg{width:22px;height:22px}
    .node .name{font-family:var(--font-display);font-size:12px;font-weight:600;color:var(--text-bright);letter-spacing:.2px}
    .node .sub{font-size:10px;color:var(--text-muted);text-align:center;max-width:160px;line-height:1.35;word-break:break-word}
    .node.trigger{border-color:rgba(143,135,184,.4);background:rgba(143,135,184,.07)}
    .node.agent{border-color:rgba(114,151,189,.5);background:rgba(114,151,189,.07);min-width:160px}
    .node.agent .icon{background:rgba(114,151,189,.14);border-color:rgba(114,151,189,.4)}
    .node.output{border-color:rgba(131,176,138,.38);background:rgba(131,176,138,.05)}
    .node.source{border-color:rgba(199,154,94,.38);background:rgba(199,154,94,.05)}
    .flow-empty{color:var(--text-muted);font-size:12px;font-style:italic;padding:10px}

    /* Task pipeline */
    .task-pipeline{display:flex;flex-direction:column;gap:0}
    .task-row{display:flex;align-items:stretch;gap:14px;padding:16px;background:var(--card-2);border:1px solid var(--border);border-radius:12px;margin-bottom:10px}
    .task-index{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:44px}
    .task-index .num{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;font-family:var(--font-display)}
    .task-index .bar{flex:1;width:2px;background:var(--border-accent);margin-top:2px;border-radius:2px}
    .task-body{flex:1;min-width:0}
    .task-name{font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--text-bright);margin-bottom:4px}
    .task-prompt{font-family:var(--font-mono);font-size:11px;line-height:1.55;color:var(--text-muted);white-space:pre-wrap;word-break:break-word;background:var(--deep);border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:8px;max-height:180px;overflow:auto}
    .task-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px 3px 5px;background:var(--card);border:1px solid var(--border);border-radius:20px;font-size:10px;color:var(--text-muted)}
    .chip svg{width:14px;height:14px}

    /* Trigger / prompt cards */
    .prompt{background:var(--deep);border:1px solid var(--border);border-radius:10px;padding:14px;font-family:var(--font-mono);font-size:12px;line-height:1.55;color:var(--text);overflow-x:auto;white-space:pre-wrap;word-break:break-word}

    /* Run history */
    .run{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:var(--card-2);transition:border-color .15s ease}
    .run:hover{border-color:var(--border-accent)}
    .run-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
    .run-time{font-family:var(--font-mono);font-size:12px;color:var(--text-bright)}
    .run-duration{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
    .run-status{font-size:11px;font-weight:600;padding:2px 10px;border-radius:20px;background:rgba(131,176,138,.1);color:var(--green);border:1px solid rgba(131,176,138,.3)}
    .run-status.err{background:rgba(196,127,127,.08);color:var(--red);border-color:rgba(196,127,127,.3)}
    .run-result{font-family:var(--font-mono);font-size:12px;line-height:1.5;color:var(--text-muted);white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto;background:var(--deep);border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:6px}
    .run-error{font-family:var(--font-mono);font-size:12px;color:var(--red);white-space:pre-wrap;word-break:break-word;background:rgba(196,127,127,.06);border:1px solid rgba(196,127,127,.25);border-radius:8px;padding:10px;margin-top:6px}
    .run-task-line{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-muted);font-family:var(--font-mono);margin:2px 0}
    .run-task-line .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
    .run-task-line.err .dot{background:var(--red)}

    .empty{color:var(--text-muted);font-size:13px;font-style:italic;padding:6px 0}
    .footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--border);color:var(--text-muted);font-size:11px;text-align:center}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}

    /* Edit modal */
    .modal-backdrop{position:fixed;inset:0;background:rgba(8,10,14,.78);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
    .modal-backdrop.open{display:flex}
    .modal{background:var(--card);border:1px solid var(--border-accent);border-radius:14px;box-shadow:0 16px 48px rgba(0,0,0,.5);width:100%;max-width:780px;padding:24px;color:var(--text)}
    .modal h2{font-family:var(--font-display);font-size:17px;font-weight:700;color:var(--text-bright);margin-bottom:4px}
    .modal .hint{font-size:12px;color:var(--text-muted);margin-bottom:18px}
    .form-row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
    .form-row.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .form-row label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);font-weight:600}
    .form-row input[type=text], .form-row textarea, .form-row select{width:100%;background:var(--deep);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:inherit;font-size:13px;outline:none;transition:border-color .15s ease,box-shadow .15s ease}
    .form-row input[type=text]:focus, .form-row textarea:focus, .form-row select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(114,151,189,.15)}
    .form-row textarea{font-family:var(--font-mono);font-size:12px;line-height:1.55;resize:vertical;min-height:80px}
    .form-row .checkbox{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text)}
    .form-row .checkbox input{width:auto;accent-color:var(--accent)}
    .tasks-editor{display:flex;flex-direction:column;gap:10px}
    .task-edit{background:var(--card-2);border:1px solid var(--border);border-radius:10px;padding:12px;position:relative}
    .task-edit .task-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .task-edit .task-head .num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .task-edit .task-head input{flex:1}
    .task-edit .remove-task{background:transparent;border:1px solid var(--border);color:var(--text-muted);border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;font-family:inherit;transition:color .15s ease,border-color .15s ease}
    .task-edit .remove-task:hover{color:var(--red);border-color:rgba(196,127,127,.4)}
    .add-task-btn{background:var(--card-2);border:1px dashed var(--border-accent);color:var(--text-muted);border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer;font-family:inherit;transition:color .15s ease,border-color .15s ease}
    .add-task-btn:hover{color:var(--text);border-color:var(--accent)}
    .mode-switch{display:flex;gap:4px;background:var(--card-2);border:1px solid var(--border);border-radius:8px;padding:3px;width:fit-content;margin-bottom:8px}
    .mode-switch button{background:transparent;border:none;color:var(--text-muted);padding:6px 14px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;transition:background .15s ease,color .15s ease}
    .mode-switch button.active{background:var(--accent);color:var(--on-accent)}
    .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;border-top:1px solid var(--border);padding-top:16px}
    .btn{background:var(--card-2);border:1px solid var(--border);color:var(--text);padding:8px 18px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;transition:border-color .15s ease}
    .btn:hover{border-color:var(--border-accent)}
    .btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent)}
    .btn.primary:hover{opacity:.9}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .modal-error{color:var(--red);font-size:12px;background:rgba(196,127,127,.07);border:1px solid rgba(196,127,127,.28);border-radius:8px;padding:8px 10px;margin-top:10px;display:none}
    .modal-error.show{display:block}
    .edit-btn{cursor:pointer;font-family:inherit;color:var(--text);background:var(--card);display:inline-flex;align-items:center;gap:4px}
  </style>
</head>
<body>
  <header>
    <div>
      <h1 id="title">workflow</h1>
      <div class="meta" id="subtitle"></div>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-label="Toggle color theme"><span class="theme-toggle-knob"><svg class="tt-sun" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"/></svg><svg class="tt-moon" viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span></button>
      <div id="status-badge" class="badge">loading…</div>
      <button id="run-now-btn" class="badge" type="button"
        style="cursor:pointer;font-family:inherit;color:var(--text);background:var(--card);"
        title="Trigger this workflow immediately, outside its schedule.">▶ run now</button>
      <button id="gitops-sync-btn" class="badge" type="button"
        style="cursor:pointer;font-family:inherit;color:var(--text);background:var(--card);display:none;"
        title="Reconcile this workflow registry with the source repo right now.">⟳ sync now</button>
      <button id="toggle-btn" class="badge" type="button"
        style="cursor:pointer;font-family:inherit;color:var(--text);background:var(--card);display:none;"
        title="Pause or resume this workflow. Paused workflows stop ticking and stop responding to on_success / on_failure triggers.">⏸ pause</button>
      <button id="edit-btn" class="badge edit-btn" type="button"
        title="Edit this workflow from the UI (name, prompt, tasks, schedule, trigger, enabled).">
        <svg viewBox="0 0 16 16" width="12" height="12" xmlns="http://www.w3.org/2000/svg" style="fill:currentColor"><path d="M11.013 1.427a1.75 1.75 0 0 1 2.474 0l1.086 1.086a1.75 1.75 0 0 1 0 2.474l-8.61 8.61c-.21.21-.47.364-.756.445l-3.251.93a.75.75 0 0 1-.927-.928l.929-3.25c.081-.286.235-.547.445-.758l8.61-8.61zm1.414 1.06a.25.25 0 0 0-.354 0L10.811 3.75l1.439 1.44 1.263-1.263a.25.25 0 0 0 0-.354l-1.086-1.086zM11.189 6.25 9.75 4.811l-6.286 6.287a.25.25 0 0 0-.064.108l-.558 1.953 1.953-.558a.249.249 0 0 0 .108-.064l6.286-6.287z"/></svg>
        edit
      </button>
      <a class="badge" href="/ui/">← agents</a>
    </div>
  </header>
  <main>
    <p class="description" id="description"></p>
    <div id="gitops-banner" style="display:none;background:rgba(114,151,189,.08);border:1px solid rgba(114,151,189,.4);border-radius:10px;padding:12px 14px;margin-bottom:14px;color:var(--text);font-size:13px;line-height:1.55"></div>
    <div id="disabled-banner" style="display:none;background:rgba(196,127,127,.08);border:1px solid rgba(196,127,127,.35);border-radius:10px;padding:14px 16px;margin-bottom:18px;color:var(--red);font-size:13px;line-height:1.55"></div>
    <div class="meta-grid" id="meta-grid"></div>

    <div class="card">
      <div class="card-title">Flow diagram <span class="count" id="pattern-badge">—</span></div>
      <div id="flow-diagram"></div>
    </div>

    <div class="card" id="tasks-card" style="display:none">
      <div class="card-title">Tasks <span class="count" id="task-count">0</span></div>
      <div id="tasks" class="task-pipeline"></div>
    </div>

    <div class="card" id="prompt-card">
      <div class="card-title">Prompt</div>
      <pre class="prompt" id="prompt"></pre>
    </div>

    <div class="card">
      <div class="card-title">Run history <span class="count" id="run-count">0</span></div>
      <div id="runs"></div>
    </div>

    <div class="footer" id="footer"></div>
  </main>

  <!-- Edit modal -->
  <div id="edit-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
    <div class="modal">
      <h2 id="edit-modal-title">Edit workflow</h2>
      <div class="hint">Changes take effect on the next tick. Run history is preserved.</div>

      <div class="form-row">
        <label for="edit-name">Name</label>
        <input type="text" id="edit-name" autocomplete="off" />
      </div>

      <div class="form-row">
        <label for="edit-description">Description</label>
        <textarea id="edit-description" rows="2"></textarea>
      </div>

      <div class="form-row two">
        <div class="form-row" style="margin-bottom:0">
          <label for="edit-cron">Cron (UTC, schedule only)</label>

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str == null ? '' : String(str);
      return d.innerHTML;
    }
    function formatTime(s) {
      if (!s) return '—';

    // sourceRefToURL parses a "<owner>/<repo>@<branch>:<path>" SourceRef
    // into a github.com blob URL, or returns null when the format doesn't
    // match.
    function sourceRefToURL(ref) {
      if (!ref || typeof ref !== 'string') return null;
      const m = ref.match(/^([^/\s]+)\/([^@\s]+)@([^:\s]+):(.+)$/);
      if (!m) return null;
      return 'https://github.com/' + encodeURIComponent(m[1]) + '/' + encodeURIComponent(m[2]) +
        '/blob/' + encodeURIComponent(m[3]) + '/' + m[4].split('/').map(encodeURIComponent).join('/');
    }

    // ---------- GitOps status / sync-now (shared with the dashboards view) ----
    // The status endpoint reports whether a syncer is wired and, if so, when
    // it last reconciled. The sync endpoint is fire-and-block; the button is
    // disabled while a request is in flight to prevent double-clicks.
    function gitopsStatusLine(st) {
      const parts = [];
      parts.push(st.repo + (st.branch ? '@' + st.branch : '@<default>'));
      if (st.last_sync) {
        const t = new Date(st.last_sync);
        if (!isNaN(t.getTime()) && t.getTime() > 0) parts.push('last reconcile ' + t.toLocaleString());
      } else {
        parts.push('not yet reconciled');
      }
      if (st.running) parts.push('syncing now…');
      return parts.join(' · ');
    }
    async function refreshGitopsStatus(kind) {
      const el = document.getElementById('gitops-status');
      const btn = document.getElementById('gitops-sync-btn');
      try {
        const r = await fetch('/api/' + kind + '/_gitops', { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const body = await r.json();
        if (!body.enabled || !body.status) {
          if (el) {
            el.textContent = 'Sync polling is not configured on this server.';
            el.style.color = 'var(--text-muted)';
          }
          if (btn) { btn.disabled = true; btn.style.opacity = '.5'; btn.style.cursor = 'not-allowed'; btn.title = 'GitOps sync is not enabled on this server.'; btn.style.display = 'none'; }
          return;
        }
        if (!el) return;
        const st = body.status;
        el.textContent = gitopsStatusLine(st);
        el.style.color = st.last_error ? 'var(--red)' : 'var(--text-muted)';
        if (st.last_error) el.textContent += ' — error: ' + st.last_error;
      } catch (e) {
        if (el) {
          el.textContent = 'Could not load sync status: ' + e.message;
          el.style.color = 'var(--red)';
        }
      }
    }
    async function triggerGitopsSync(kind) {
      const btn = document.getElementById('gitops-sync-btn');
      const el = document.getElementById('gitops-status');
      if (!btn) return;
      const orig = btn.textContent;
      btn.disabled = true;
      btn.textContent = '⟳ syncing…';
      btn.style.cursor = 'wait';
      if (el) { el.textContent = 'Reconciling against the source repo…'; el.style.color = 'var(--text-muted)'; }
      try {
        const r = await fetch('/api/' + kind + '/_gitops/sync', { method: 'POST' });
        if (!r.ok) {
          const txt = await r.text();
          throw new Error(txt || ('HTTP ' + r.status));
        }
        await refreshGitopsStatus(kind);
        // Reload the entity so any changes from the sync are visible.
        if (typeof load === 'function') load();
      } catch (e) {
        if (el) { el.textContent = 'Sync failed: ' + e.message; el.style.color = 'var(--red)'; }
      } finally {
        btn.disabled = false;
        btn.textContent = orig;
        btn.style.cursor = 'pointer';
      }
    }

    // Scan text for integrations. Returns an ordered list of unique integrations.
    // Keywords are matched with word boundaries when they are purely alphanumeric
    // (so `gh` doesn't match "right", `c0` doesn't match "c0lor", etc.); keys
    // containing punctuation or spaces (e.g. "project =", ".github", "pr ") fall
    // back to substring matching since \b anchors don't apply around symbols.
    const KEY_RE_CACHE = new Map();
    function keyMatcher(key) {
      let re = KEY_RE_CACHE.get(key);
      if (re !== undefined) return re;
      if (/^[a-z0-9]+$/i.test(key)) {
        re = new RegExp('\\b' + key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
      } else {
        re = null; // use substring
      }
      KEY_RE_CACHE.set(key, re);
      return re;
    }
    function detectIntegrations(text) {
      if (!text) return [];
      const lower = text.toLowerCase();
      const out = [];
      const seen = new Set();
      const matches = (keys) => {
        if (!keys) return false;
        for (const key of keys) {
          const re = keyMatcher(key);
          if (re ? re.test(text) : lower.includes(key.toLowerCase())) return true;
        }
        return false;
      };
      for (const integ of INTEGRATIONS) {
        if (seen.has(integ.id)) continue;
        if (!matches(integ.keys)) continue;
        let effectiveKind = integ.kind;
        // For 'both' integrations, narrow the placement to source or output
        // when only one intent is actually used in the prompt. This keeps
        // the diagram honest (e.g. a GitHub-read-only workflow shows GitHub
        // only under "Read from", not under "Write to").
        if (integ.kind === 'both' && (integ.readKeys || integ.writeKeys)) {
          const r = matches(integ.readKeys);
          const w = matches(integ.writeKeys);
          if (r && !w) effectiveKind = 'source';
          else if (w && !r) effectiveKind = 'output';
          else effectiveKind = 'both'; // both or neither → show on both
        }
        out.push(Object.assign({}, integ, { kind: effectiveKind }));
        seen.add(integ.id);
      }
      return out;
    }

    function nodeHTML({ kind, iconSvg, name, sub }) {
      return (
        '<div class="node ' + (kind || '') + '">' +
          '<div class="icon">' + iconSvg + '</div>' +
          '<div class="name">' + escapeHtml(name) + '</div>' +
          (sub ? '<div class="sub">' + escapeHtml(sub) + '</div>' : '') +
        '</div>'
      );
    }

    function arrowRow() {
      return '<div class="flow-connector">' + ARROW_SVG + '</div>';
    }

    function laneHTML(label, nodesHtml) {
      if (!nodesHtml) return '';
      return (
        '<div>' +
          '<div class="flow-lane-label">' + escapeHtml(label) + '</div>' +
          '<div class="flow-row">' + nodesHtml + '</div>' +
        '</div>'
      );
    }

    // Build the flow diagram: Trigger → Sources → Agent → Outputs.
    function renderDiagram(wf, integrations) {
      const trigType = (wf.trigger && wf.trigger.type) || 'schedule';
      let triggerNode;
      if (trigType === 'schedule') {
        triggerNode = nodeHTML({ kind:'trigger', iconSvg:CLOCK_SVG, name:'Schedule', sub:'cron: ' + (wf.cron || '—') + ' UTC' });
      } else if (trigType === 'on_success' || trigType === 'on_failure') {
        triggerNode = nodeHTML({ kind:'trigger', iconSvg:BOLT_SVG, name:trigType.replace('_',' '), sub:wf.trigger.ref });
      } else {
        triggerNode = nodeHTML({ kind:'trigger', iconSvg:HAND_SVG, name:'Manual', sub:'run via API' });
      }

      const sources = integrations.filter(i => i.kind === 'source' || i.kind === 'both');
      const outputs = integrations.filter(i => i.kind === 'output' || i.kind === 'both');

      const sourceNodes = sources.length
        ? sources.map(i => nodeHTML({ kind:'source', iconSvg:i.svg, name:i.name })).join('')
        : '<div class="flow-empty">No integrations detected in the prompt.</div>';

      const agentNode = nodeHTML({
        kind:'agent',
        iconSvg:'<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><circle cx="16" cy="12" r="6" fill="#7297bd"/><path d="M6 28c0-5.5 4.5-10 10-10s10 4.5 10 10" fill="#7297bd"/></svg>',
        name:'/' + (wf.agent || 'agent'),
        sub:'LLM tool-loop'
      });

      const outputNodes = outputs.length
        ? outputs.map(i => nodeHTML({ kind:'output', iconSvg:i.svg, name:i.name })).join('')
        : '';

      let html = '<div class="flow">';
      html += laneHTML('Trigger', triggerNode);
      html += arrowRow();
      html += laneHTML('Read from', sourceNodes);
      html += arrowRow();
      html += laneHTML('Agent', agentNode);
      if (outputNodes) {
        html += arrowRow();
        html += laneHTML('Write to', outputNodes);
      }
      html += '</div>';
      return html;
    }

    function taskChipsHTML(promptText) {
      const integs = detectIntegrations(promptText);
      if (!integs.length) return '';
      return '<div class="task-chips">' +
        integs.map(i => '<span class="chip">' + i.svg + escapeHtml(i.name) + '</span>').join('') +
        '</div>';
    }

    async function load() {
      const path = window.location.pathname.replace(/\/$/, '');
      const res = await fetch(path + '/data.json', { cache: 'no-store' });
      if (!res.ok) {
        document.getElementById('title').textContent = 'workflow not found';
        return;
      }
      const wf = await res.json();
      window.__wf = wf;
      document.title = 'arbetern — ' + (wf.name || wf.id);
      document.getElementById('title').textContent = wf.name || wf.id;
      document.getElementById('subtitle').textContent =
        '/' + wf.agent + ' · id ' + wf.id + ' · cron ' + (wf.cron || '—') + ' UTC · created ' + formatTime(wf.created_at);

      const badge = document.getElementById('status-badge');
      if (wf.running) {
        badge.textContent = 'running…';
        badge.className = 'badge running';
      } else if (!wf.enabled) {
        badge.textContent = wf.disabled_reason ? 'auto-disabled' : 'paused';
        badge.className = 'badge ' + (wf.disabled_reason ? 'err' : 'paused');
      } else if (wf.last_error) {
        badge.textContent = 'last run errored'; badge.className = 'badge err';
      } else if (wf.last_run) {
        badge.textContent = 'last run ok'; badge.className = 'badge ok';
      } else {
        badge.textContent = 'pending first run'; badge.className = 'badge';
      }

      // Toggle button reflects current state: shows "pause" when enabled,
      // "resume" when disabled. The "run now" button is hidden for disabled
      // workflows to match the backend behaviour (runners are stopped).
      const toggleBtn = document.getElementById('toggle-btn');
      toggleBtn.style.display = '';
      if (wf.enabled) {
        toggleBtn.textContent = '⏸ pause';
        toggleBtn.title = 'Pause this workflow. It will stop ticking and stop responding to on_success / on_failure triggers until resumed.';
      } else {
        toggleBtn.textContent = '▶ resume';
        toggleBtn.title = 'Resume this workflow. Scheduled ticks and event triggers will fire again.';
      }
      document.getElementById('run-now-btn').style.display = wf.enabled ? '' : 'none';
      const runBtn = document.getElementById('run-now-btn');
      if (wf.running) {
        runBtn.disabled = true;
        runBtn.title = 'A tick is currently in progress.';
        runBtn.textContent = '▶ running…';
      } else {
        runBtn.disabled = false;
        runBtn.title = 'Trigger this workflow immediately.';
        runBtn.textContent = '▶ run now';
      }

      const disabledBanner = document.getElementById('disabled-banner');
      if (!wf.enabled && wf.disabled_reason) {
        disabledBanner.style.display = 'block';
        disabledBanner.innerHTML =
          '<strong>⚠ Auto-disabled</strong> — ' + escapeHtml(wf.disabled_reason);
      } else {
        disabledBanner.style.display = 'none';
      }

      // GitOps-managed workflows are read-only in the UI: edits made here
      // would be overwritten on the next reconcile, so we hide the edit
      // button and show a banner linking back to the source file in git.
      const editBtn = document.getElementById('edit-btn');
      const gitopsBanner = document.getElementById('gitops-banner');
      const gitopsSyncBtn = document.getElementById('gitops-sync-btn');
      if (wf.source === 'gitops') {
        editBtn.style.display = 'none';
        // Pause/resume stays available for GitOps workflows: it only toggles
        // the runtime trigger (cron ticks, on_success / on_failure events) and
        // doesn't mutate the workflow definition that GitOps reconciles.
        const link = sourceRefToURL(wf.source_ref);
        const sourceLine = link
          ? 'Edit it at <a href="' + link + '" target="_blank" rel="noopener">' + escapeHtml(wf.source_ref) + '</a>.'
          : 'Edits here would be overwritten on the next sync.';
        gitopsBanner.style.display = 'block';
        gitopsBanner.innerHTML =
          '<div><strong>Managed via GitOps.</strong> ' + sourceLine + '</div>' +
          '<div id="gitops-status" style="font-size:12px;color:var(--text-muted);margin-top:6px">checking sync status…</div>';
        gitopsSyncBtn.style.display = '';
        if (!gitopsSyncBtn.dataset.bound) {
          gitopsSyncBtn.addEventListener('click', () => triggerGitopsSync('workflows'));
          gitopsSyncBtn.dataset.bound = '1';
        }
        refreshGitopsStatus('workflows');
      } else {
        editBtn.style.display = '';
        gitopsBanner.style.display = 'none';
        // The GitOps sync button is still useful for non-gitops workflows:
        // pressing it triggers a server-wide reconcile, which can pull in a
        // newly added descriptor from the source repo (e.g. when the user
        // just committed a new workflow JSON and wants it visible without
        // waiting for the poll interval). It is hidden only when the
        // server has no GitOps syncer configured at all.
        gitopsSyncBtn.style.display = '';
        if (!gitopsSyncBtn.dataset.bound) {
          gitopsSyncBtn.addEventListener('click', () => triggerGitopsSync('workflows'));
          gitopsSyncBtn.dataset.bound = '1';
        }
        // refreshGitopsStatus disables the button (and changes its title)
        // when the server reports `enabled: false`, so we get the right
        // affordance for both states with no extra branching here.
        refreshGitopsStatus('workflows');
      }

      document.getElementById('description').textContent = wf.description || '';

      const hasTasks = Array.isArray(wf.tasks) && wf.tasks.length > 0;
      const trig = wf.trigger || {};
      const trigType = trig.type || 'schedule';
      const pattern = hasTasks ? 'subflows'
        : (trigType === 'on_success' || trigType === 'on_failure') ? 'event-triggered'
        : trigType === 'manual' ? 'manual'
        : 'monoflow';
      document.getElementById('pattern-badge').textContent = pattern;

      // Gather integrations across all prompt text for the top-level diagram.
      const allText = hasTasks
        ? (wf.tasks || []).map(t => (t.name || '') + ' ' + (t.prompt || '')).join('\n')
        : (wf.prompt || '');
      const integrations = detectIntegrations(allText);
      document.getElementById('flow-diagram').innerHTML = renderDiagram(wf, integrations);

      // Meta grid
      const items = [
        { label: 'Agent', value: '/' + wf.agent },
        { label: 'Pattern', value: pattern },
        { label: 'Cron (UTC)', value: trigType === 'schedule' ? (wf.cron || '—') : '—' },
        { label: 'Trigger', value: trigType + (trig.ref ? ' (' + trig.ref + ')' : '') },
        { label: 'Enabled', value: wf.enabled ? 'yes' : 'no' },
        { label: 'Created by', value: wf.created_by || '—' },
        { label: 'Last run', value: formatTime(wf.last_run) },
      ];
      document.getElementById('meta-grid').innerHTML = items.map(i =>
        '<div class="meta-item"><div class="label">' + escapeHtml(i.label) + '</div><div class="value">' + escapeHtml(i.value) + '</div></div>'
      ).join('');

      // Tasks vs prompt
      const tasksCard = document.getElementById('tasks-card');
      const promptCard = document.getElementById('prompt-card');
      if (hasTasks) {
        promptCard.style.display = 'none';
        tasksCard.style.display = 'block';
        document.getElementById('task-count').textContent = wf.tasks.length;
        document.getElementById('tasks').innerHTML = wf.tasks.map((t, i) => {
          const isLast = i === wf.tasks.length - 1;
          return (
            '<div class="task-row">' +
              '<div class="task-index">' +
                '<div class="num">' + (i+1) + '</div>' +
                (isLast ? '' : '<div class="bar"></div>') +
              '</div>' +
              '<div class="task-body">' +
                '<div class="task-name">' + escapeHtml(t.name) + '</div>' +
                taskChipsHTML(t.prompt) +
                '<div class="task-prompt">' + escapeHtml(t.prompt) + '</div>' +
              '</div>' +
            '</div>'
          );
        }).join('');
      } else {
        document.getElementById('prompt').textContent = wf.prompt || '';
      }

      // Run history
      const runsEl = document.getElementById('runs');
      const runs = wf.runs || [];
      document.getElementById('run-count').textContent = runs.length;
      if (runs.length === 0) {
        runsEl.innerHTML = '<div class="empty">No runs yet — the first execution happens immediately after creation.</div>';
      } else {
        runsEl.innerHTML = runs.map(r => {
          const ok = !r.error;
          const statusCls = ok ? 'run-status' : 'run-status err';
          const statusText = ok ? 'ok' : 'error';
          const taskBlock = Array.isArray(r.tasks) && r.tasks.length > 0
            ? r.tasks.map((t, i) => {
                const tStatus = t.error ? 'error' : 'ok';
                return '<div class="run-task-line' + (t.error ? ' err' : '') + '">' +
                  '<span class="dot"></span>' +
                  (i+1) + '. ' + escapeHtml(t.name) + ' — ' + tStatus + ' (' + (t.duration_ms || 0) + 'ms)' +
                  (t.error ? '  err: ' + escapeHtml(t.error) : '') +
                  '</div>';
              }).join('')
            : '';
          const body = ok
            ? taskBlock + (r.result ? '<div class="run-result">' + escapeHtml(r.result) + '</div>' : '')
            : taskBlock + '<div class="run-error">' + escapeHtml(r.error) + '</div>' + (r.result ? '<div class="run-result">' + escapeHtml(r.result) + '</div>' : '');
          const trigBadge = r.triggered_by ? '<span class="run-duration">· ' + escapeHtml(r.triggered_by) + '</span>' : '';
          return (
            '<div class="run">' +
              '<div class="run-head">' +
                '<span class="run-time">' + escapeHtml(formatTime(r.started_at)) + '</span>' +
                '<span class="run-duration">' + escapeHtml((r.duration_ms || 0) + ' ms') + '</span>' +
                trigBadge +
                '<span class="' + statusCls + '">' + statusText + '</span>' +
              '</div>' +
              body +
            '</div>'
          );
        }).join('');
      }

      const footer = document.getElementById('footer');
      footer.innerHTML = 'Last refreshed ' + escapeHtml(new Date().toLocaleString()) +
        '. Raw JSON: <a id="raw-link" href="' + escapeHtml(path + '/data.json') + '">data.json</a>';
    }

    load().catch(e => console.error(e));
    // Poll every 30s normally; when a tick is in flight, poll every 3s so
    // the "running…" badge and run history update quickly.
    let pollTimer = null;
    function schedulePoll() {
      if (pollTimer) clearTimeout(pollTimer);
      const delay = (window.__wf && window.__wf.running) ? 3000 : 30000;
      pollTimer = setTimeout(() => {
        load().catch(() => {}).finally(schedulePoll);
      }, delay);
    }
    schedulePoll();

    // "Run now" button: POSTs to /api/workflows/<agent>/<id>/run. The server
    // returns 202 Accepted immediately and executes the workflow in its own
    // goroutine, so the UI is not blocked on long-running ticks. We auto-
    // refresh the run-history for a short window after the trigger so the
    // new run shows up on its own without requiring a manual page reload.
    document.getElementById('run-now-btn').addEventListener('click', async () => {
      const btn = document.getElementById('run-now-btn');
      const parts = window.location.pathname.replace(/\/$/, '').split('/').filter(Boolean);
      if (parts.length < 3) return;
      const agent = parts[0];
      const id = parts[2];
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = '⏳ triggering…';
      btn.style.opacity = '0.7';
      try {
        const res = await fetch('/api/workflows/' + encodeURIComponent(agent) + '/' + encodeURIComponent(id) + '/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: '{}',
        });
        if (!res.ok && res.status !== 202) {
          const text = await res.text().catch(() => '');
          btn.textContent = '✗ failed';
          console.error('run-now failed:', res.status, text);
          setTimeout(() => { btn.textContent = original; btn.disabled = false; btn.style.opacity = ''; }, 3000);
          return;
        }
        btn.textContent = '✓ queued';
        // Poll every 5s for up to 5 minutes so the new run shows up as soon
        // as the server finishes it. Polling is cheap and idempotent; it
        // overlaps the 30s auto-refresh loop but uses cache:no-store so it
        // always gets fresh data.
        const stopAt = Date.now() + 5 * 60 * 1000;
        const poll = async () => {
          await load().catch(() => {});
          if (Date.now() < stopAt) setTimeout(poll, 5000);
        };
        setTimeout(poll, 2000);
      } catch (e) {
        console.error('run-now error:', e);
        btn.textContent = '✗ error';
      } finally {
        setTimeout(() => { btn.textContent = original; btn.disabled = false; btn.style.opacity = ''; }, 2500);
      }
    });

    // -------- Edit workflow modal --------
    const editModal = document.getElementById('edit-modal');
    const editErr = document.getElementById('edit-error');
    let editMode = 'prompt'; // 'prompt' | 'tasks'
    let editTasks = [];      // [{name, prompt}]

    function setEditMode(mode) {
      editMode = mode;
      document.getElementById('mode-prompt').classList.toggle('active', mode === 'prompt');
      document.getElementById('mode-tasks').classList.toggle('active', mode === 'tasks');
      document.getElementById('edit-prompt-row').style.display = mode === 'prompt' ? '' : 'none';
      document.getElementById('edit-tasks-row').style.display  = mode === 'tasks'  ? '' : 'none';
    }

    function renderEditTasks() {
      const host = document.getElementById('edit-tasks');
      if (editTasks.length === 0) {
        host.innerHTML = '<div class="empty">No tasks yet — click "add task" to create one.</div>';
        return;
      }
      host.innerHTML = editTasks.map((t, i) =>
        '<div class="task-edit" data-idx="' + i + '">' +
          '<div class="task-head">' +
            '<div class="num">' + (i+1) + '</div>' +
            '<input type="text" class="task-name-input" placeholder="Task name" value="' + escapeHtml(t.name || '') + '" />' +
            '<button type="button" class="remove-task">remove</button>' +
          '</div>' +
          '<textarea class="task-prompt-input" rows="4" placeholder="Task prompt">' + escapeHtml(t.prompt || '') + '</textarea>' +
        '</div>'
      ).join('');
      host.querySelectorAll('.task-edit').forEach(row => {
        const idx = Number(row.dataset.idx);
        row.querySelector('.task-name-input').addEventListener('input', (e) => { editTasks[idx].name = e.target.value; });
        row.querySelector('.task-prompt-input').addEventListener('input', (e) => { editTasks[idx].prompt = e.target.value; });
        row.querySelector('.remove-task').addEventListener('click', () => {
          editTasks.splice(idx, 1);
          renderEditTasks();
        });
      });
    }

    function updateTriggerRefVisibility() {
      const t = document.getElementById('edit-trigger-type').value;
      const needsRef = t === 'on_success' || t === 'on_failure';
      document.getElementById('edit-trigger-ref-row').style.display = needsRef ? '' : 'none';
    }

    function openEdit() {
      const wf = window.__wf;
      if (!wf) return;
      editErr.classList.remove('show');
      editErr.textContent = '';
      document.getElementById('edit-name').value = wf.name || '';
      document.getElementById('edit-description').value = wf.description || '';
      document.getElementById('edit-cron').value = wf.cron || '';
      document.getElementById('edit-enabled').checked = !!wf.enabled;
      const trig = wf.trigger || {};
      document.getElementById('edit-trigger-type').value = trig.type || 'schedule';
      document.getElementById('edit-trigger-ref').value = trig.ref || '';
      updateTriggerRefVisibility();
      document.getElementById('edit-prompt').value = wf.prompt || '';
      editTasks = Array.isArray(wf.tasks) ? wf.tasks.map(t => ({ name: t.name || '', prompt: t.prompt || '' })) : [];
      renderEditTasks();
      setEditMode(editTasks.length > 0 ? 'tasks' : 'prompt');
      editModal.classList.add('open');
    }
    function closeEdit() { editModal.classList.remove('open'); }

    document.getElementById('edit-btn').addEventListener('click', openEdit);
    document.getElementById('edit-cancel').addEventListener('click', closeEdit);
    editModal.addEventListener('click', (e) => { if (e.target === editModal) closeEdit(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && editModal.classList.contains('open')) closeEdit();
    });
    document.getElementById('mode-prompt').addEventListener('click', () => setEditMode('prompt'));
    document.getElementById('mode-tasks').addEventListener('click', () => setEditMode('tasks'));
    document.getElementById('edit-trigger-type').addEventListener('change', updateTriggerRefVisibility);
    document.getElementById('add-task-btn').addEventListener('click', () => {
      editTasks.push({ name: '', prompt: '' });
      renderEditTasks();
    });

    document.getElementById('edit-save').addEventListener('click', async () => {
      const wf = window.__wf;
      if (!wf) return;
      editErr.classList.remove('show');
      editErr.textContent = '';

      const body = {
        name: document.getElementById('edit-name').value.trim(),
        description: document.getElementById('edit-description').value,
        cron: document.getElementById('edit-cron').value.trim(),
        enabled: document.getElementById('edit-enabled').checked,
        trigger: {
          type: document.getElementById('edit-trigger-type').value,
          ref: document.getElementById('edit-trigger-ref').value.trim(),
        },
      };
      if (!body.name) {
        editErr.textContent = 'Name is required.';
        editErr.classList.add('show');
        return;
      }
      if (editMode === 'prompt') {
        body.prompt = document.getElementById('edit-prompt').value;
        body.tasks = []; // clear tasks when switching to monoflow
        if (!body.prompt.trim()) {
          editErr.textContent = 'Prompt is required in monoflow mode.';
          editErr.classList.add('show');
          return;
        }
      } else {
        const cleaned = editTasks
          .map(t => ({ name: (t.name || '').trim(), prompt: (t.prompt || '').trim() }))
          .filter(t => t.name || t.prompt);
        if (cleaned.length === 0) {
          editErr.textContent = 'At least one task is required in subflow mode.';
          editErr.classList.add('show');
          return;
        }
        for (let i = 0; i < cleaned.length; i++) {
          if (!cleaned[i].name || !cleaned[i].prompt) {
            editErr.textContent = 'Task ' + (i+1) + ' needs both a name and a prompt.';
            editErr.classList.add('show');
            return;
          }
        }
        body.tasks = cleaned;
        body.prompt = ''; // clear prompt when switching to subflow
      }

      const saveBtn = document.getElementById('edit-save');
      const original = saveBtn.textContent;
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving…';
      try {
        const res = await fetch('/api/workflows/' + encodeURIComponent(wf.agent) + '/' + encodeURIComponent(wf.id), {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          const text = await res.text().catch(() => '');
          editErr.textContent = 'Save failed: ' + (text || res.status);
          editErr.classList.add('show');
          return;
        }
        closeEdit();
        await load().catch(() => {});
      } catch (e) {
        editErr.textContent = 'Save error: ' + (e && e.message ? e.message : e);
        editErr.classList.add('show');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = original;
      }
    });

    // One-click pause / resume. Uses the same PATCH endpoint as the edit
    // modal but sends only { enabled: bool }, so the backend cancels the
    // tick goroutine (when pausing) or restarts it (when resuming) without
    // touching any other field. Auto-disabled workflows also get their
    // failure counter cleared by the server when we resume them.
    document.getElementById('toggle-btn').addEventListener('click', async () => {
      const wf = window.__wf;
      if (!wf) return;
      const btn = document.getElementById('toggle-btn');
      const original = btn.textContent;
      const wantEnabled = !wf.enabled;
      btn.disabled = true;
      btn.textContent = wantEnabled ? '⏳ resuming…' : '⏳ pausing…';
      try {
        const res = await fetch('/api/workflows/' + encodeURIComponent(wf.agent) + '/' + encodeURIComponent(wf.id), {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ enabled: wantEnabled }),
        });
        if (!res.ok) {
          const text = await res.text().catch(() => '');
          btn.textContent = '✗ failed';
          console.error('toggle failed:', res.status, text);
          setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 3000);
          return;
        }
        await load().catch(() => {});
      } catch (e) {
        console.error('toggle error:', e);
        btn.textContent = '✗ error';
        setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 3000);
      } finally {
        btn.disabled = false;
      }
    });

    // Theme toggle (dark ⇆ light, persisted).
    (function(){
      const btn = document.getElementById('theme-toggle');
      function label(t){
        btn.title = 'Switch to ' + (t === 'light' ? 'dark' : 'light') + ' theme';
        btn.setAttribute('aria-checked', String(t !== 'light'));
      }
      btn.addEventListener('click', () => {
        const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem('arbetern-theme', next); } catch (e) {}
        label(next);
      });
      label(document.documentElement.dataset.theme || 'dark');
    })();
  </script>
</body>
</html>
